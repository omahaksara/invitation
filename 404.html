<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Membuka Undangan — Omah Aksara</title>
  <style>
    :root{color-scheme:light}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f8f6f0;color:#343a32;font:15px/1.6 system-ui,sans-serif}
    main{text-align:center;padding:28px;max-width:420px}
    p{color:#77796f}
  </style>
</head>
<body>
  <main>
    <strong>Omah Aksara</strong>
    <p>Mengalihkan ke undangan…</p>
  </main>
  <script>
    (() => {
      const parts = location.pathname.split("/").filter(Boolean);
      if (parts[0] !== "i" || !parts[1]) {
        location.replace("/");
        return;
      }
      let slug = "";
      let guest = "";
      try {
        slug = decodeURIComponent(parts[1]);
        guest = parts[2] ? decodeURIComponent(parts.slice(2).join("/")) : "";
      } catch (_) {
        location.replace("/");
        return;
      }
      if (!/^[a-z0-9][a-z0-9-]*$/i.test(slug)) {
        location.replace("/");
        return;
      }
      const target = new URL("/", location.origin);
      target.searchParams.set("c", slug);
      if (guest) target.searchParams.set("to", guest);
      const requestedTheme = new URLSearchParams(location.search).get("theme");
      if (requestedTheme && /^[a-z0-9][a-z0-9-]*$/i.test(requestedTheme)) {
        target.searchParams.set("theme", requestedTheme);
      }
      location.replace(target.toString());
    })();
  </script>
</body>
</html>
