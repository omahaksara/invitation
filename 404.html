<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Inter:wght@300&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background: #181314; color: #E0A996; display: flex; align-items: center; justify-content: center; height: 100vh; margin: 0; text-align: center; }
        .wrap { animation: fadeIn 1s ease; }
        .names { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0.5rem 0; color: #FCE8E3; }
        .sub { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
        .dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
        @keyframes fadeIn { from{opacity:0;transform:translateY(10px)} to{opacity:1;transform:translateY(0)} }
    </style>
</head>
<body>
    <div class="wrap">
        <div class="sub">The Wedding Of</div>
        <div id="names" class="names">...</div>
        <div class="sub">membuka undangan<span class="dots"></span></div>
    </div>
<script>
let rawUrl = window.location.href;
let sp = new URLSearchParams(window.location.search);
let client = sp.get('c');
let toParam = sp.get('to');

if(!toParam && rawUrl.includes('&to=')){
  toParam = rawUrl.split('&to=')[1].split('&')[0].split('#')[0];
  toParam = decodeURIComponent(toParam.replace(/\+/g,' '));
}
if(!toParam && rawUrl.includes('?to=')){
  let m = rawUrl.split('to=')[1];
  if(m){ toParam = decodeURIComponent(m.split('&')[0].split('#')[0].replace(/\+/g,' ')); }
}

if(!client){
  const parts = window.location.pathname.split('/').filter(Boolean);
  const maybe = parts[0]==='invitation' && parts.length>=2? parts[1] : parts[0];
  if(maybe && !['templates','public','invitation'].includes(maybe)){
    client = maybe.split('&')[0].split('?')[0].split('#')[0];
  }
}

// Deteksi Basis URL Otomatis (Mendukung GitHub Pages & Localhost)
const baseUrl = window.location.hostname.includes('github.io') 
    ? 'https://omahaksara.github.io/invitation' 
    : window.location.origin;

if (!client) {
    document.getElementById('names').textContent = 'Omah Aksara';
} else {
    client = client.split('&')[0].split('?')[0];
    fetch(`${baseUrl}/public/clients/${client}/data.json`)
    .then(res => {
        if (!res.ok) throw new Error('Data tidak ditemukan');
        return res.json();
    })
    .then(data => {
        const g = data.couple?.groom?.nickname || '';
        const b = data.couple?.bride?.nickname || '';
        document.getElementById('names').textContent = `${g} & ${b}`;
        const template = data.meta?.template || 'modern-pink';
        
        setTimeout(() => {
            const toQuery = toParam ? `&to=${encodeURIComponent(toParam)}` : '';
            window.location.href = `${baseUrl}/templates/${template}/index.html?c=${client}${toQuery}`;
        }, 800);
     })
    .catch(() => {
        document.getElementById('names').textContent = 'Gagal Memuat Undangan';
    });
}
</script>
</body>
</html>
