<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f6f0">
  <meta name="description" content="Undangan pernikahan digital dari Omah Aksara.">
  <title>Undangan Pernikahan — Omah Aksara</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500;600&family=Inter:wght@300;400;500;600&family=Montserrat:wght@300;400;500;600&family=Playfair+Display:wght@400;500;600&family=Scheherazade+New:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="core/global.css?v=20261028b">
  <link id="theme-style" rel="stylesheet" href="">
  <style>
    body { margin:0; min-height:100vh; background:#f8f6f0; color:#343a32; font-family:'Inter',sans-serif; }
    .loading-wrap { min-height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; gap:12px; text-align:center; padding:24px; box-sizing:border-box; }
    .loading-names { margin:0; color:#343a32; font-family:'Playfair Display',serif; font-size:clamp(1.8rem,6vw,2.5rem); font-weight:400; }
    .loading-sub { margin:0; color:#77796f; font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; }
    .error-desc { max-width:520px; color:#77796f; font-size:.9rem; line-height:1.7; overflow-wrap:anywhere; }
    .dots::after { content:''; animation:dots 1.5s infinite; }
    @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
    @media(prefers-reduced-motion:reduce){.dots::after{animation:none}}
  </style>
</head>
<body>
  <div id="app" aria-live="polite">
    <div class="loading-wrap">
      <p class="loading-sub">Omah Aksara Studio</p>
      <h1 class="loading-names">Memuat Undangan</h1>
      <p class="loading-sub">Menyiapkan halaman<span class="dots"></span></p>
    </div>
  </div>
  <script src="core/app.js?v=20261028b" defer></script>
</body>
</html>
