<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan — Omah Aksara</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <!-- Font Awesome untuk Ikon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Placeholder CSS Templat -->
    <link id="theme-style" rel="stylesheet" href="">
    <style>
        body { margin: 0; padding: 0; background-color: #181314; color: #E0A996; font-family: 'Inter', sans-serif; }
        .loading-wrap { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .loading-names { font-family: 'Playfair Display', serif; font-size: 2.2rem; margin: 0.5rem 0; color: #FCE8E3; }
        .loading-sub { font-size: 0.75rem; letter-spacing: 0.2em; text-transform: uppercase; opacity: 0.7; }
        .dots::after { content: ''; animation: dots 1.5s infinite; }
        @keyframes dots { 0%{content:''} 33%{content:'.'} 66%{content:'..'} 100%{content:'...'} }
    </style>
</head>
<body>

    <!-- Wadah Utama Aplikasi -->
    <div id="app">
        <div class="loading-wrap">
            <div class="loading-sub">Omah Aksara Studio</div>
            <div id="names" class="loading-names">Memuat Undangan</div>
            <div class="loading-sub">menyiapkan halaman<span class="dots"></span></div>
        </div>
    </div>

    <!-- Skrip Engine Utama -->
    <script>
        document.addEventListener("DOMContentLoaded", async () => {
            try {
                // 1. Tangkap parameter 'c' dari URL (contoh: ?c=budi-ani)
                const urlParams = new URLSearchParams(window.location.search);
                const klien = urlParams.get('c');

                if (!klien) {
                    document.getElementById('app').innerHTML = `
                        <div class="loading-wrap">
                            <h3 style="color: #FCE8E3; font-family: 'Playfair Display', serif;">Tautan Undangan Tidak Valid</h3>
                            <p style="font-size: 0.85rem; opacity: 0.7;">Pastikan tautan menyertakan nama klien.</p>
                        </div>`;
                    return;
                }

                // 2. Ambil data.json dari folder clients/ [SESUAI STRUKTUR BARU]
                const responseJson = await fetch(`clients/${klien}/data.json`);
                if (!responseJson.ok) throw new Error("Data klien tidak ditemukan.");
                const data = await responseJson.json();

                // 3. Ambil nama tema dari data.json (misal: "o" atau "serein")
                const tema = data.theme || 'o';

                // 4. Tarik CSS dan HTML dari folder templates/ [SESUAI STRUKTUR BARU]
                const themeFolder = `templates/${tema}`;
                document.getElementById('theme-style').href = `${themeFolder}/style.css`;
                
                const responseHtml = await fetch(`${themeFolder}/index.html`);
                if (!responseHtml.ok) throw new Error("Templat gagal dimuat.");
                const htmlText = await responseHtml.text();

                // 5. Masukkan HTML templat ke wadah #app
                document.getElementById('app').innerHTML = htmlText;

                // 6. Jalankan binding data
                bindDataAndInit(data, klien);

            } catch (error) {
                console.error("Gagal memuat:", error);
                document.getElementById('app').innerHTML = `
                    <div class="loading-wrap">
                        <h3 style="color: #FCE8E3; font-family: 'Playfair Display', serif;">Maaf, Undangan Tidak Ditemukan</h3>
                        <p style="font-size: 0.85rem; opacity: 0.7;">Periksa kembali nama folder klien di GitHub.</p>
                    </div>`;
            }
        });

        function bindDataAndInit(data, klien) {
            // A. Binding teks dan aset gambar/audio dari folder clients/
            document.querySelectorAll('[data-bind]').forEach(el => {
                const path = el.getAttribute('data-bind');
                const value = getNestedValue(data, path);
                if (value !== undefined) {
                    if (el.tagName === 'IMG' || el.tagName === 'AUDIO') {
                        el.src = `clients/${klien}/${value}`;
                    } else {
                        el.textContent = value;
                    }
                }
            });

            // B. Ambil nama tamu dari parameter 'to' di URL
            const urlParams = new URLSearchParams(window.location.search);
            const guestName = urlParams.get('to');
            const defaultGuest = data.guest?.defaultName || "Tamu Undangan";
            const guestElement = document.getElementById('nama-tamu');
            if (guestElement) {
                guestElement.textContent = guestName ? decodeURIComponent(guestName.replace(/-/g, ' ')) : defaultGuest;
            }

            // C. Tautan Google Maps
            if (data.events?.akad?.mapsUrl) {
                const akadMap = document.getElementById('link-akad-maps');
                if (akadMap) akadMap.href = data.events.akad.mapsUrl;
            }
            if (data.events?.resepsi?.mapsUrl) {
                const resepsiMap = document.getElementById('link-resepsi-maps');
                if (resepsiMap) resepsiMap.href = data.events.resepsi.mapsUrl;
            }

            // D. Tombol Buka Undangan & Musik
            const coverSection = document.getElementById('cover-section');
            const mainContent = document.getElementById('main-content');
            const musicToggle = document.getElementById('music-toggle');
            const bgMusic = document.getElementById('bg-music');
            const openBtn = document.getElementById('open-invitation-btn');

            if (openBtn) {
                openBtn.addEventListener('click', () => {
                    if (coverSection) {
                        coverSection.style.opacity = '0';
                        setTimeout(() => {
                            coverSection.style.display = 'none';
                            if (mainContent) mainContent.style.display = 'block';
                            if (musicToggle) musicToggle.style.display = 'flex';
                        }, 500);
                    }
                    if (bgMusic && bgMusic.src) {
                        bgMusic.play().catch(err => console.log("Audio diblokir browser:", err));
                    }
                });
            }

            let isPlaying = true;
            if (musicToggle && bgMusic) {
                musicToggle.addEventListener('click', () => {
                    if (isPlaying) {
                        bgMusic.pause();
                        musicToggle.innerHTML = '<i class="fa-solid fa-compact-disc"></i>';
                    } else {
                        bgMusic.play();
                        musicToggle.innerHTML = '<i class="fa-solid fa-compact-disc fa-spin"></i>';
                    }
                    isPlaying = !isPlaying;
                });
            }
        }

        function getNestedValue(obj, path) {
            return path.split('.').reduce((acc, part) => acc && acc[part], obj);
        }

        function copyRekening() {
            const numEl = document.getElementById('rekening-num');
            if (numEl) {
                const num = numEl.innerText;
                navigator.clipboard.writeText(num).then(() => alert("Nomor rekening disalin: " + num));
            }
        }
    </script>
</body>
</html>
