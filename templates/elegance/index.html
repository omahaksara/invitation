<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The Wedding of Liviana & Adhira — Omah Aksara VIP Ticket</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-dark: #09090b;
            --marble-black: #121214;
            --text-gold: #d4af37;
            --border-zinc: #27272a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Times New Roman', Times, serif;
            background: var(--bg-dark); color: #ffffff; overflow-x: hidden;
        }
        /* Efek Tekstur Marmer Gelap untuk Latar Belakang Premium */
        .marble-overlay {
            background-image: url('https://images.unsplash.com/photo-1504198453319-5ce911bafcde?q=80&w=600');
            background-size: cover; background-position: center; filter: invert(1) opacity(0.08);
            position: absolute; inset: 0; pointer-events: none; z-index: 1;
        }
        .phone-container {
            max-width: 390px; margin: 0 auto; min-height: 100vh; background: #000000;
            position: relative; border-left: 1px solid var(--border-zinc); border-right: 1px solid var(--border-zinc);
            display: flex; flex-direction: column; z-index: 2; box-shadow: 0 0 30px rgba(0,0,0,0.8);
        }
        /* Struktur Tiket VIP Fisik (Plus Plong & Tiket Robek) */
        .vip-ticket {
            background: var(--marble-black); border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px; position: relative; overflow: hidden;
        }
        .vip-ticket::before, .vip-ticket::after {
            content: ''; position: absolute; width: 24px; height: 24px; background: #000000;
            border-radius: 50%; top: 35%; z-index: 10;
        }
        .vip-ticket::before { left: -12px; border-right: 1px solid rgba(255,255,255,0.1); }
        .vip-ticket::after { right: -12px; border-left: 1px solid rgba(255,255,255,0.1); }
        
        .ticket-divider {
            border-top: 2px dashed rgba(255,255,255,0.2); position: absolute;
            top: 36.3%; left: 12px; right: 12px; height: 1px;
        }
        /* Polaroid Photo Strip Layout */
        .photo-strip {
            background: #ffffff; padding: 10px 10px 24px 10px; box-shadow: 0 8px 20px rgba(0,0,0,0.4);
            transform: rotate(-1.5deg);
        }
        .photo-frame { width: 100%; aspect-ratio: 1/1; background: #eee; overflow: hidden; margin-bottom: 8px; }
        .photo-frame img { width: 100%; height: 100%; object-fit: cover; }
        
        .shimmer {
            background: linear-gradient(90deg, #18181b 25%, #27272a 37%, #18181b 63%);
            background-size: 400% 100%; animation: loading 1.4s ease infinite;
        }
        @keyframes loading { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
    </style>
</head>
<body>

<div class="phone-container p-4 space-y-6">
    <div class="marble-overlay"></div>

    <div id="main-ticket" class="vip-ticket w-full p-6 space-y-6 relative z-10 opacity-0 transform translate-y-10">
        
        <div class="text-center space-y-2 pt-2">
            <p class="text-[10px] tracking-[0.4em] text-zinc-400 uppercase">The Wedding Of</p>
            <h1 id="couple-title" class="text-2xl font-bold tracking-wide text-white">Liviana & Adhira</h1>
            <div class="w-12 h-[1px] bg-[var(--text-gold)] mx-auto my-2"></div>
        </div>

        <div class="photo-strip mx-auto w-[85%] mt-2">
            <div class="photo-frame"><img id="photo-1" src="https://images.unsplash.com/photo-1519741497674-611481863552?q=80&w=400" alt="Mempelai"></div>
            <div class="photo-frame"><img id="photo-2" src="https://images.unsplash.com/photo-1511285560929-80b456fea0bc?q=80&w=400" alt="Mempelai"></div>
            <p class="text-center text-zinc-800 text-[11px] tracking-widest uppercase font-sans font-bold mt-1">Save The Date</p>
        </div>

        <div class="ticket-divider"></div>

        <div class="pt-8 text-center space-y-4">
            <div class="bg-black/40 border border-zinc-800 rounded-xl py-3 px-2">
                <p class="text-[10px] tracking-widest text-zinc-400 uppercase font-sans mb-1">VIP PASS EXCLUSIVELY FOR</p>
                <p id="guest-ticket-name" class="text-base font-bold text-[var(--text-gold)] tracking-wide">Nama Tamu</p>
            </div>

            <div class="space-y-1">
                <p id="wedding-day" class="text-lg font-bold">Selasa, 25 April 2026</p>
                <p class="text-xs text-zinc-400 font-sans tracking-wide">Pukul: 08.00 WIB s/d Selesai</p>
                <p id="wedding-place" class="text-xs text-zinc-300 italic">Tempat: Kediaman Mempelai Wanita</p>
            </div>
            
            <div class="flex flex-col items-center justify-center pt-2 gap-1">
                <i class="fa-solid fa-barcode text-4xl tracking-widest text-white opacity-80"></i>
                <p class="text-[9px] font-sans tracking-[0.2em] text-zinc-500 uppercase">RUSTIC18-OMAHAKSARA</p>
            </div>
        </div>
    </div>

    <div class="bg-zinc-900/60 border border-zinc-800/80 p-5 rounded-2xl space-y-4 relative z-10">
        <h3 class="text-center text-sm font-bold tracking-wider text-[var(--text-gold)] uppercase"><i class="fa-solid fa-envelope-open-text mr-2"></i>Kirim Doa Restu</h3>
        
        <form id="wishes-form" class="space-y-3 font-sans text-xs">
            <input type="text" id="wish-name" placeholder="Nama Anda" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-zinc-600 transition" required>
            
            <textarea id="wish-message" rows="3" placeholder="Tulis ucapan & doa restu tulus di sini..." class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-zinc-600 transition" required></textarea>
            
            <select id="wish-status" class="w-full p-3 bg-zinc-950 border border-zinc-800 rounded-xl text-white focus:outline-none focus:border-zinc-600 transition">
                <option value="Hadir">Saya Akan Hadir</option>
                <option value="Tidak Hadir">Berhalangan Hadir</option>
            </select>
            
            <button type="submit" class="w-full bg-[#222] border border-zinc-700 text-white font-bold py-3.5 rounded-xl active:scale-[0.98] transition tracking-widest uppercase text-[10px]">Kirim Ucapan</button>
        </form>

        <div id="wishes-box" class="space-y-2 max-h-60 overflow-y-auto pt-2 font-sans">
            <div class="p-3 bg-zinc-950 rounded-xl space-y-2"><div class="h-3 w-1/3 rounded shimmer"></div><div class="h-2 w-3/4 rounded shimmer"></div></div>
        </div>
    </div>
</div>

<script>
    // Ambil Parameter URL Dinamis (?c=id_klien&to=Nama+Tamu)
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('c') || 'budi-ani';
    const to = (params.get('to') || 'Tamu Undangan').replace(/\+/g, ' ');

    // LINK API GOOGLE WEB APP ANDA YANG SUDAH TERPASANG OTOMATIS
    const URL_WEB_APP = "https://script.google.com/macros/s/AKfycbwdLwxmDaMKPO-JQBvNcUUskHl4mhZXhB4NvOL_hh--qzVEaDiXmrzCFI3OgHeB7KRlHQ/exec";

    // Path Aset Statis Fleksibel untuk GitHub Pages
    const BASE_PATH = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/invitation/') + 12);
    const pathDataKlien = `${BASE_PATH}public/clients/${slug}/`;

    document.getElementById('guest-ticket-name').innerText = to;
    document.getElementById('wish-name').value = to;

    // Fetch Skema Data JSON Klien Secara Otomatis
    fetch(`${pathDataKlien}data.json`)
        .then(res => res.json())
        .then(data => {
            // Update Data DOM dari File JSON Klien
            document.getElementById('couple-title').innerText = `${data.couple.groom.nickname} & ${data.couple.bride.nickname}`;
            
            if(data.gallery && data.gallery.album) {
                document.getElementById('photo-1').src = pathDataKlien + data.gallery.album[0];
                document.getElementById('photo-2').src = pathDataKlien + data.gallery.album[1];
            }

            const targetDate = new Date(data.events[0].date);
            document.getElementById('wedding-day').innerText = targetDate.toLocaleDateString('id-ID', {weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'});
            document.getElementById('wedding-place').innerText = `Tempat: ${data.events[0].address}`;

            // Animasi Intro Masuk Menggunakan GSAP
            gsap.to("#main-ticket", { opacity: 1, y: 0, duration: 1.2, ease: "power4.out" });
            
            // Muat Data Ucapan dari Google Sheets
            loadWishesFromDatabase();
        })
        .catch(err => {
            console.error("Gagal Memuat File JSON Klien:", err);
            gsap.to("#main-ticket", { opacity: 1, y: 0, duration: 1 });
            loadWishesFromDatabase();
        });

    // KIRIM DATA FORM KE GOOGLE SHEETS (AUTO SAVE & ANTI-HILANG)
    document.getElementById('wishes-form').onsubmit = function(e) {
        e.preventDefault();
        
        // Ubah status tombol menjadi loading selama proses penyimpanan berlangsung
        const submitBtn = this.querySelector('button[type="submit"]');
        const originalText = submitBtn.innerText;
        submitBtn.innerText = "MENGIRIM DOA...";
        submitBtn.disabled = true;
        
        const payload = {
            id_klien: slug, // Penanda otomatis pemisah antar klien
            nama: document.getElementById('wish-name').value,
            ucapan: document.getElementById('wish-message').value,
            kehadiran: document.getElementById('wish-status').value,
            jumlah_tamu: 1
        };

        fetch(URL_WEB_APP, {
            method: 'POST',
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(response => {
            if(response.status === 'success') {
                document.getElementById('wish-message').value = '';
                loadWishesFromDatabase(); // Muat ulang list ucapan secara otomatis
            }
        })
        .catch(err => alert("Gagal mengirim doa, periksa koneksi internet Anda."))
        .finally(() => {
            // Kembalikan tombol ke teks awal setelah data dipastikan aman di Sheet
            submitBtn.innerText = originalText;
            submitBtn.disabled = false;
        });
    };

    // LOAD DATA UCAPAN DARI GOOGLE SHEETS (AUTO FILTER PER KLIEN)
    function loadWishesFromDatabase() {
        const targetBox = document.getElementById('wishes-box');
        
        fetch(`${URL_WEB_APP}?id_klien=${slug}`)
        .then(res => res.json())
        .then(data => {
            targetBox.innerHTML = '';
            if(!data || data.length === 0) {
                targetBox.innerHTML = `<p class="text-[11px] text-zinc-500 italic text-center py-4">Belum ada untaian doa dari tamu.</p>`;
                return;
            }

            data.forEach(w => {
                targetBox.innerHTML += `
                    <div class="bg-zinc-950 border border-zinc-800/60 p-3 rounded-xl text-left">
                        <div class="flex justify-between items-center mb-1">
                            <span class="text-xs font-bold text-zinc-200">${w.nama}</span>
                            <span class="text-[9px] bg-zinc-800 text-zinc-400 px-2 py-0.5 rounded-md font-sans">${w.kehadiran}</span>
                        </div>
                        <p class="text-xs text-zinc-400 font-light leading-relaxed">${w.ucapan}</p>
                    </div>`;
            });
        }).catch(() => {
            targetBox.innerHTML = `<p class="text-[11px] text-red-400/70 italic text-center py-4">Gagal memuat database ucapan.</p>`;
        });
    }
</script>
</body>
</html>
