<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>IG — Omah Aksara</title>
<style>
:root{--ig-bg:#fafafa;--ig-border:#dbdbdb;--ig-text:#262626;--ig-gray:#8e8e8e;--ig-blue:#0095f6}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--ig-bg);color:var(--ig-text);overflow-x:hidden}
.phone{max-width:430px;margin:0 auto;background:#fff;min-height:100vh;border-left:1px solid var(--ig-border);border-right:1px solid var(--ig-border)}
#cover{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;justify-content:space-between;transition:transform .9s cubic-bezier(.76,0,.24,1)}
#cover.hide{transform:translateY(-100%)}
.cover-bg{position:absolute;inset:0;opacity:.6;filter:blur(20px);background:radial-gradient(circle at 30% 20%,#feda75 0%,#fa7e1e 15%,#d62976 35%,#962fbf 55%,#4f5bd5 85%)}
.story-ring{width:122px;height:122px;border-radius:50%;padding:3px;background:conic-gradient(from 45deg,#feda75,#fa7e1e,#d62976,#962fbf,#4f5bd5,#feda75);margin:0 auto}
.story-ring-inner{width:100%;height:100%;border-radius:50%;background:#fff;padding:3px}
.story-ring-inner div{width:100%;height:100%;border-radius:50%;background:linear-gradient(135deg,#ffecd2,#fcb69f);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:32px}
.btn-ig{background:var(--ig-blue);color:#fff;border:none;border-radius:8px;padding:12px 28px;font-weight:600;font-size:14px;cursor:pointer}
/* ... (full CSS seperti yang aku buat) ... */
</style>
</head>
<body>
<!-- Cover IG Story Style -->
<div id="cover">
  <div class="cover-bg"></div>
  <div style="position:relative;z-index:2;padding:24px;text-align:center;color:#fff">
    <div style="font-size:10px;letter-spacing:.4em;opacity:.8">— KEPADA —</div>
    <div id="coverGuest" style="margin-top:12px;background:rgba(255,255,255,.15);backdrop-filter:blur(10px);display:inline-block;padding:8px 18px;border-radius:20px;font-weight:600">Tamu Undangan</div>
  </div>
  <div style="position:relative;z-index:2;text-align:center;color:#fff">
    <div class="story-ring"><div class="story-ring-inner"><div id="coverInitials">B & A</div></div></div>
    <h1 id="coverNames" style="margin-top:18px;font-size:28px;font-weight:300">Budi & Ani</h1>
    <div id="coverDate" style="font-size:13px;opacity:.9">12 November 2026</div>
  </div>
  <div style="position:relative;z-index:2;padding:24px 24px 40px;text-align:center">
    <button class="btn-ig" onclick="openInv()">Lihat Instagram Story →</button>
  </div>
</div>
<!-- ... lanjut feed IG ... -->
</body>
</html>
