<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Karsa — Omah Aksara</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Montserrat:wght@300;400;500&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root { 
            --theme-color: #1A1A1A; 
            --bg-color: #FAFAFA; 
            --text-color: #2D2D2D; 
            --soft-color: #E5E5E5; 
            --white-soft: #FFFFFF; 
        }
        body { 
            background: #121212; 
            color: var(--text-color); 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
        }
        .font-serif { font-family: 'Cormorant Garamond', serif; }
        .font-arab { font-family: 'Scheherazade New', serif; line-height: 2.5; }
        .reveal { opacity: 0; transform: translateY(20px); transition: all 1.2s cubic-bezier(0.16, 1, 0.3, 1); }
        .reveal.active { opacity: 1; transform: translateY(0); }
        .phone-wrapper { max-width: 425px; margin: 0 auto; background: var(--bg-color); position: relative; min-height: 100vh; }
        .modern-frame { width: 100%; aspect-ratio: 4/5; overflow: hidden; background: #F5F5F5; border: 1px solid var(--soft-color); }
        .modern-frame img { width: 100%; height: 100%; object-fit: cover; }
        #cover { transition: transform 1.2s cubic-bezier(0.76, 0, 0.24, 1); }
        
        /* Custom scrollbar untuk kotak ucapan */
        .wishes-container::-webkit-scrollbar { width: 4px; }
        .wishes-container::-webkit-scrollbar-track { background: transparent; }
        .wishes-container::-webkit-scrollbar-thumb { background: var(--soft-color); border-radius: 2px; }
    </style>
</head>
<body>

<!-- COVERS SECTION -->
<section id="cover" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#121212]">
    <img id="cover-image" class="absolute inset-0 w-full h-full object-cover opacity-30" src="">
    <div class="absolute inset-0 bg-gradient-to-b from-transparent to-[#121212]/80"></div>
    <div class="relative z-10 text-center text-white px-8 w-full max-w-sm">
        <h1 id="cover-names" class="font-serif text-4xl mb-6 tracking-wide leading-normal"></h1>
        <p class="text-[10px] uppercase tracking-[0.3em] text-stone-400 mb-2">Kepada Yth.</p>
        <p id="cover-guest" class="font-serif text-2xl mb-12 italic border-b border-white/20 pb-4 inline-block px-4"></p>
        <br>
        <button id="open-btn" class="border border-white/40 px-8 py-4 text-xs uppercase tracking-[0.3em] bg-transparent hover:bg-white hover:text-black transition-all duration-500">
            Buka Undangan
        </button>
    </div>
</section>

<!-- MAIN APPLICATION -->
<main id="app" class="phone-wrapper opacity-0 transition-opacity duration-1000 pb-12">
    
    <!-- HERO SECTION -->
    <section class="relative h-[75vh] flex items-end justify-center pb-16">
        <img id="hero-image" class="absolute inset-0 w-full h-full object-cover" src="">
        <div class="absolute inset-0 bg-gradient-to-t from-linear from-[var(--bg-color)] via-transparent to-transparent"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-[var(--bg-color)] via-transparent to-transparent"></div>
        <div class="relative z-10 text-center w-full px-6">
            <p class="text-[9px] uppercase tracking-[0.4em] text-stone-500 mb-2">Pernikahan Dari</p>
            <h2 id="hero-names" class="font-serif text-4xl font-light tracking-wide"></h2>
        </div>
    </section>

    <!-- QUOTE SECTION -->
    <section class="px-8 py-20 text-center bg-[var(--white-soft)] border-y border-stone-100">
        <div class="reveal">
            <p id="quote-arab" class="font-arab text-3xl mb-6 text-stone-600"></p>
            <p id="quote-text" class="font-serif italic text-sm text-stone-500 leading-relaxed"></p>
            <p id="quote-source" class="text-[9px] mt-4 uppercase tracking-widest text-stone-400 font-medium"></p>
        </div>
    </section>

    <!-- BRIDE & GROOM BIOGRAPHY -->
    <section class="py-20 px-8 space-y-16">
        <div id="groom-section" class="text-center"></div>
        <div id="bride-section" class="text-center"></div>
    </section>

    <!-- TIMELINE STORY -->
    <section id="story-section" class="py-20 px-8 bg-[var(--white-soft)] border-y border-stone-100 hidden">
        <h3 class="font-serif text-center text-2xl tracking-wide mb-12">Kisah Kami</h3>
        <div id="story-list" class="space-y-8 relative before:absolute before:inset-y-0 before:left-2 before:w-px before:bg-stone-200"></div>
    </section>

    <!-- AGENDA & EVENTS -->
    <section id="event-section" class="py-20 px-8 hidden">
        <h3 class="font-serif text-center text-2xl tracking-wide mb-12">Waktu & Tempat</h3>
        <div id="event-list" class="space-y-8"></div>
        
        <!-- COUNTDOWN TIMER -->
        <div id="countdown-wrap" class="hidden mt-16 pt-8 border-t border-stone-200 text-center animate-fade-in">
            <p class="text-[9px] uppercase tracking-widest text-stone-400 mb-6 font-medium">Menuju Hari Bahagia</p>
            <div id="countdown" class="flex justify-center gap-3"></div>
        </div>
    </section>

    <!-- IMAGE ALBUM GALLERY -->
    <section id="gallery-section" class="py-20 px-6 bg-[var(--white-soft)] border-y border-stone-100 hidden">
        <h3 class="font-serif text-center text-2xl tracking-wide mb-10">Galeri Rupa</h3>
        <div id="gallery-grid" class="grid grid-cols-2 gap-3"></div>
    </section>

    <!-- DIGITAL GIFT / BANK ACCOUNTS -->
    <section id="gift-section" class="py-20 px-8 hidden">
        <h3 class="font-serif text-center text-2xl tracking-wide mb-10">Tanda Kasih</h3>
        <div id="gift-container" class="space-y-4"></div>
    </section>

    <!-- RSVP & REGISTRATION FORM -->
    <section id="rsvp-section" class="py-20 px-8">
        <h3 class="font-serif text-center text-2xl tracking-wide mb-10">Konfirmasi Kehadiran</h3>
        
        <form id="wishes-form" class="space-y-5 bg-[var(--white-soft)] p-6 border border-stone-200 rounded-lg shadow-sm">
            <div>
                <label class="block text-[9px] uppercase tracking-wider text-stone-400 mb-1 font-medium">Nama Lengkap</label>
                <input id="wish-name" type="text" required placeholder="Tulis nama Anda" class="w-full border-b border-stone-300 py-2 text-xs focus:outline-none focus:border-black transition">
            </div>
            
            <div class="grid grid-cols-2 gap-4">
                <div>
                    <label class="block text-[9px] uppercase tracking-wider text-stone-400 mb-1 font-medium">Konfirmasi</label>
                    <select id="wish-status" class="w-full border-b border-stone-300 py-2 text-xs bg-transparent focus:outline-none focus:border-black transition">
                        <option value="Hadir">Hadir</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                    </select>
                </div>
                <div>
                    <label class="block text-[9px] uppercase tracking-wider text-stone-400 mb-1 font-medium">Jumlah Pax</label>
                    <select id="wish-pax" class="w-full border-b border-stone-300 py-2 text-xs bg-transparent focus:outline-none focus:border-black transition">
                        <option value="1">1 Orang</option>
                        <option value="2">2 Orang</option>
                        <option value="3">3 Orang</option>
                        <option value="4">4 Orang</option>
                    </select>
                </div>
            </div>
            
            <div>
                <label class="block text-[9px] uppercase tracking-wider text-stone-400 mb-1 font-medium">Pesan & Doa Restu</label>
                <textarea id="wish-message" required rows="3" placeholder="Tulis ucapan selamat Anda" class="w-full border border-stone-300 p-3 text-xs focus:outline-none focus:border-black transition resize-none rounded"></textarea>
            </div>
            
            <button type="submit" class="w-full bg-black text-white py-4 text-xs font-medium uppercase tracking-widest hover:bg-stone-800 transition shadow-sm">
                Kirim Konfirmasi
            </button>
        </form>

        <!-- DISSEMINATION OF WISHES -->
        <div class="mt-12">
            <p class="text-[10px] uppercase tracking-widest text-stone-400 mb-4 font-semibold text-center">Ucapan & Doa Restu</p>
            <div id="wishes-box" class="wishes-container space-y-3 max-h-80 overflow-y-auto pr-1"></div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-16 bg-black text-white text-center px-6">
        <p class="text-[9px] uppercase tracking-[0.4em] text-stone-500 mb-2">Terima Kasih</p>
        <h2 id="footer-names" class="font-serif text-2xl font-light tracking-wide"></h2>
    </footer>
</main>

<script>
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'afif-sindi';
    const guestName = params.get('to')?.replace(/\+/g,' ') || 'Tamu Undangan';
    
    const isSubFolder = window.location.pathname.includes('/templates/');
    const basePath = isSubFolder ? `../../public/clients/${clientSlug}/` : `public/clients/${clientSlug}/`;
    
    let SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwzbrMzVWSHCF9u8I1FbY4h4i_GoxL6kvTbFxFrcZ-VG9_qun2wK0c4mIupBKiGk1Yvmw/exec";

    fetch(`${basePath}data.json`, { cache: 'no-store' })
    .then(res => {
        if(!res.ok) throw new Error(`data.json tidak ditemukan di ${basePath}data.json`);
        return res.json();
    })
    .then(data => {
        const { couple, settings, events, gallery, loveStory, quote, music, digitalGift, link } = data;
        const pairNick = `${couple.groom.nickname} & ${couple.bride.nickname}`;
        
        if(link?.apiUcapan) SCRIPT_URL = link.apiUcapan;
        if(settings?.themeColor) document.documentElement.style.setProperty('--theme-color', settings.themeColor);

        document.getElementById('cover-names').innerText = pairNick;
        document.getElementById('hero-names').innerText = pairNick;
        document.getElementById('footer-names').innerText = pairNick;
        document.getElementById('cover-guest').innerText = guestName;
        document.getElementById('cover-image').src = basePath + gallery.heroImage;
        document.getElementById('hero-image').src = basePath + gallery.heroImage;
        
        if(quote?.text){
            document.getElementById('quote-arab').innerText = quote.arab || '';
            document.getElementById('quote-text').innerText = quote.text;
            document.getElementById('quote-source').innerText = quote.source || '';
        }
        
        document.getElementById('groom-section').innerHTML = `
            <div class="modern-frame reveal"><img src="${basePath+couple.groom.image}"></div>
            <h4 class="font-serif text-2xl mt-4 font-light tracking-wide">${couple.groom.name}</h4>
            <p class="text-xs text-stone-400 font-light mt-1">Putra dari ${couple.groom.father} & ${couple.groom.mother}</p>`;
            
        document.getElementById('bride-section').innerHTML = `
            <div class="modern-frame reveal"><img src="${basePath+couple.bride.image}"></div>
            <h4 class="font-serif text-2xl mt-4 font-light tracking-wide">${couple.bride.name}</h4>
            <p class="text-xs text-stone-400 font-light mt-1">Putri dari ${couple.bride.father} & ${couple.bride.mother}</p>`;

        if(events?.length){ 
            document.getElementById('event-section').classList.remove('hidden'); 
            document.getElementById('event-list').innerHTML = events.map(ev => `
                <div class="bg-[var(--white-soft)] border border-stone-200 p-6 rounded-lg shadow-sm text-center reveal">
                    <h5 class="font-serif text-lg tracking-wide mb-2">${ev.title}</h5>
                    <p class="text-xs font-medium text-stone-600 mb-1">${ev.date}</p>
                    <p class="text-xs text-stone-400 font-mono mb-3">${ev.startTime} ${ev.endTime ? ' - ' + ev.endTime : ''}</p>
                    <p class="text-xs text-stone-500 font-light leading-relaxed mb-4">${ev.address}</p>
                    <a href="${ev.googleMaps}" target="_blank" class="inline-block text-[10px] uppercase tracking-wider border border-stone-300 px-4 py-2 hover:bg-black hover:text-white transition">Buka Google Maps</a>
                </div>`).join('');
                
            if (settings?.showCountdown) {
                initCountdown(events[0].date + 'T' + (events[0].startTime || '00:00') + ':00');
            }
        }
        
        if(loveStory?.length && settings.showLoveStory){ 
            document.getElementById('story-section').classList.remove('hidden'); 
            document.getElementById('story-list').innerHTML = loveStory.map(ls => `
                <div class="pl-8 relative reveal">
                    <div class="absolute w-3 h-3 bg-black rounded-full left-[2px] top-1.5 border-2 border-[var(--bg-color)]"></div>
                    <span class="text-[10px] font-mono font-medium text-stone-400 block mb-0.5">${ls.date}</span>
                    <h6 class="font-serif text-base font-normal tracking-wide text-stone-700 mb-1">${ls.title}</h6>
                    <p class="text-xs text-stone-500 font-light leading-relaxed">${ls.description}</p>
                </div>`).join(''); 
        }
        
        if(gallery?.album?.length && settings.showGallery){ 
            document.getElementById('gallery-section').classList.remove('hidden'); 
            document.getElementById('gallery-grid').innerHTML = gallery.album.map(img => `
                <div class="overflow-hidden border border-stone-200 p-1 bg-white reveal">
                    <img src="${basePath+img}" class="w-full h-full object-cover aspect-square" loading="lazy">
                </div>`).join(''); 
        }
        
        if(digitalGift?.accounts?.length && settings.showGift){ 
            document.getElementById('gift-section').classList.remove('hidden'); 
            document.getElementById('gift-container').innerHTML = digitalGift.accounts.map((b,i) => `
                <div class="border border-stone-200 p-6 rounded-lg text-center bg-[var(--white-soft)] shadow-sm reveal">
                    <p class="text-[10px] uppercase tracking-widest text-stone-400 font-medium mb-1">${b.provider}</p>
                    <p id="rek-${i}" class="font-serif text-xl tracking-wide font-medium text-stone-700 my-1">${b.accountNumber}</p>
                    <p class="text-xs text-stone-500 font-light mb-4">a.n ${b.accountHolder}</p>
                    <button onclick="copyToClipboard('rek-${i}')" class="text-[9px] uppercase tracking-wider border border-stone-300 px-3 py-1.5 rounded hover:bg-stone-50 transition">Salin Nomor</button>
                </div>`).join(''); 
        }

        // AMBIL DATA DARI INTEGRASI LOCAL / SPREADSHEET
        loadWishes();

        document.getElementById('open-btn').onclick = () => {
            document.getElementById('cover').style.transform = 'translateY(-100%)';
            document.getElementById('app').style.opacity = '1';
            
            // Aktivasi deteksi animasi per komponen saat di-scroll
            const observer = new IntersectionObserver(entries => {
                entries.forEach(e => { if(e.isIntersecting) e.target.classList.add('active'); });
            }, { threshold: 0.05 });
            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };
    })
    .catch(err => {
        console.error(err);
        document.body.innerHTML = `
            <div class="text-center p-12 text-stone-700 bg-white min-h-screen flex flex-col justify-center items-center font-sans">
                <h1 class="text-lg font-semibold mb-2">Konfigurasi Gagal Dimuat</h1>
                <p class="text-xs text-stone-400 max-w-xs leading-relaxed">Pastikan file data berkas json tersinkronisasi dengan benar pada direktori target klien.</p>
            </div>`;
    });

    // SISTEM COUNTDOWN OTOMATIS
    function initCountdown(targetDateString) {
        const targetTime = new Date(targetDateString).getTime();
        if(isNaN(targetTime)) return;
        
        document.getElementById('countdown-wrap').classList.remove('hidden');
        
        const timer = setInterval(() => {
            const now = new Date().getTime();
            const distance = targetTime - now;
            
            const days = Math.max(0, Math.floor(distance / (1000 * 60 * 60 * 24)));
            const hours = Math.max(0, Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60)));
            const minutes = Math.max(0, Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60)));
            const seconds = Math.max(0, Math.floor((distance % (1000 * 60)) / 1000));
            
            document.getElementById('countdown').innerHTML = `
                <div class="bg-[var(--white-soft)] border border-stone-200 rounded p-2 min-w-[55px] shadow-sm"><span class="block font-serif text-lg font-medium">${days}</span><span class="text-[7px] text-stone-400 uppercase tracking-widest block mt-0.5">Hari</span></div>
                <div class="bg-[var(--white-soft)] border border-stone-200 rounded p-2 min-w-[55px] shadow-sm"><span class="block font-serif text-lg font-medium">${hours}</span><span class="text-[7px] text-stone-400 uppercase tracking-widest block mt-0.5">Jam</span></div>
                <div class="bg-[var(--white-soft)] border border-stone-200 rounded p-2 min-w-[55px] shadow-sm"><span class="block font-serif text-lg font-medium">${minutes}</span><span class="text-[7px] text-stone-400 uppercase tracking-widest block mt-0.5">Menit</span></div>
                <div class="bg-[var(--white-soft)] border border-stone-200 rounded p-2 min-w-[55px] shadow-sm"><span class="block font-serif text-lg font-medium">${seconds}</span><span class="text-[7px] text-stone-400 uppercase tracking-widest block mt-0.5">Detik</span></div>`;
                
            if (distance < 0) clearInterval(timer);
        }, 1000);
    }

    // SALIN SALDO / REKENING KE CLIPBOARD
    function copyToClipboard(id) {
        const text = document.getElementById(id).innerText;
        navigator.clipboard.writeText(text).then(() => {
            alert('Nomor rekening berhasil disalin.');
        }).catch(() => {
            alert('Gagal menyalin data.');
        });
    }

    // MANAJEMEN PENYIMPANAN DATA RSVP (LOCAL DENGAN OPTIMALISASI API SPREADSHEET)
    document.getElementById('wishes-form')?.addEventListener('submit', function(e){
        e.preventDefault();
        const nameVal = document.getElementById('wish-name').value;
        const msgVal = document.getElementById('wish-message').value;
        const statusVal = document.getElementById('wish-status').value;
        const paxVal = parseInt(document.getElementById('wish-pax').value);
        
        const payload = { 
            id_klien: clientSlug, 
            nama: nameVal, 
            ucapan: msgVal, 
            kehadiran: statusVal, 
            jumlah_tamu: paxVal 
        };
        
        const submitBtn = e.target.querySelector('button[type="submit"]');
        submitBtn.disabled = true;
        submitBtn.innerText = "Mengirim...";

        // Simpan cadangan data lokal terlebih dahulu untuk menghindari latensi
        saveLocalWish({ nama: nameVal, ucapan: msgVal });

        fetch(SCRIPT_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify(payload) 
        })
        .then(() => {
            alert('Konfirmasi kehadiran berhasil dikirim.');
            e.target.reset();
            loadWishes();
        })
        .catch(err => {
            console.error('API Error:', err);
            loadWishes(); // Tetap render list dari penyimpanan cadangan lokal
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.innerText = "Kirim Konfirmasi";
        });
    });

    function saveLocalWish(item) {
        let current = JSON.parse(localStorage.getItem(`rsvp_${clientSlug}`)) || [];
        current.unshift(item);
        localStorage.setItem(`rsvp_${clientSlug}`, JSON.stringify(current));
    }

    function loadWishes() {
        const box = document.getElementById('wishes-box');
        box.innerHTML = '';
        
        // Panggil data lokal sebagai basis data utama
        let localData = JSON.parse(localStorage.getItem(`rsvp_${clientSlug}`)) || [];
        
        // Jika data kosong, tampilkan placeholder minimalis
        if (localData.length === 0) {
            box.innerHTML = `<p class="text-[11px] text-stone-400 text-center italic py-4">Belum ada ucapan tertulis.</p>`;
            return;
        }

        localData.forEach(w => {
            box.innerHTML += `
                <div class="bg-[var(--white-soft)] border border-stone-200 p-4 rounded text-left">
                    <p class="text-xs font-semibold text-stone-700">${w.nama || 'Anonim'}</p>
                    <p class="text-xs text-stone-500 font-light mt-1 italic leading-relaxed">"${w.ucapan || ''}"</p>
                </div>`;
        });
    }
</script>
</body>
</html>
