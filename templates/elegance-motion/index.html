<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Pernikahan</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">

    <style>
        :root { --primary: #2C2C2C; --bg: #FFFFFF; --line: #E5E5E5; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--primary); }
       .serif { font-family: 'Cormorant Garamond', serif; }
       .divider { height: 1px; background: var(--line); margin: 48px auto; max-width: 80px; }
       .btn { border: 1px solid var(--primary); padding: 12px 32px; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; transition:.3s; }
       .btn:hover { background: var(--primary); color: white; }
       .btn:disabled { opacity:.4; cursor: not-allowed; }
    </style>
</head>
<body class="antialiased">

    <!-- COVER -->
    <div id="cover" class="fixed inset-0 z-50 bg-white flex items-center justify-center text-center p-8">
        <div>
            <p class="text- tracking-[0.3em] uppercase mb-6 text-gray-500">The Wedding Of</p>
            <h1 id="names-cover" class="serif text-5xl mb-8"></h1>
            <p class="text- uppercase tracking-widest text-gray-400 mb-1">Kepada Yth.</p>
            <h2 id="guest-name" class="text-lg mb-1"></h2>
            <p id="guest-group" class="text-xs text-gray-400 mb-12"></p>
            <button onclick="openInvitation()" class="btn">Buka Undangan</button>
        </div>
    </div>

    <!-- MAIN -->
    <main id="app" class="hidden max-w-xl mx-auto">

        <!-- HEADER -->
        <section class="text-center py-24 px-8">
            <p class="text- tracking-[0.3em] uppercase text-gray-500 mb-6">Undangan Pernikahan</p>
            <h1 id="names-main" class="serif text-6xl mb-4"></h1>
            <p id="date-main" class="text-sm text-gray-600"></p>
        </section>

        <!-- COUPLE -->
        <section class="px-8 text-center">
            <div class="divider"></div>
            <div class="grid grid-cols-2 gap-8 max-w-md mx-auto">
                <div>
                    <img id="groom-img" src="" class="w-full aspect-square object-cover mb-4">
                    <h3 id="groom-name" class="serif text-2xl"></h3>
                    <p id="groom-parents" class="text- text-gray-500 mt-2 leading-relaxed"></p>
                </div>
                <div>
                    <img id="bride-img" src="" class="w-full aspect-square object-cover mb-4">
                    <h3 id="bride-name" class="serif text-2xl"></h3>
                    <p id="bride-parents" class="text- text-gray-500 mt-2 leading-relaxed"></p>
                </div>
            </div>
        </section>

        <!-- QUOTE -->
        <section id="quote-section" class="px-8 text-center hidden">
            <div class="divider"></div>
            <p id="quote-arab" class="serif text-xl mb-4 leading-loose hidden"></p>
            <p id="quote-text" class="text-sm leading-relaxed italic text-gray-600 max-w-md mx-auto"></p>
            <p id="quote-source" class="text- mt-4 tracking-[0.2em] uppercase text-gray-400"></p>
        </section>

        <!-- EVENTS -->
        <section class="px-8">
            <div class="divider"></div>
            <div id="events-list"></div>
        </section>

        <!-- COUNTDOWN -->
        <section id="countdown-section" class="px-8 text-center hidden">
            <div class="divider"></div>
            <div class="grid grid-cols-4 gap-4 max-w-sm mx-auto">
                <div><div id="days" class="serif text-3xl">00</div><p class="text- uppercase text-gray-500 mt-1">Hari</p></div>
                <div><div id="hours" class="serif text-3xl">00</div><p class="text- uppercase text-gray-500 mt-1">Jam</p></div>
                <div><div id="mins" class="serif text-3xl">00</div><p class="text- uppercase text-gray-500 mt-1">Menit</p></div>
                <div><div id="secs" class="serif text-3xl">00</div><p class="text- uppercase text-gray-500 mt-1">Detik</p></div>
            </div>
        </section>

        <!-- GALLERY -->
        <section id="gallery-section" class="px-8 hidden">
            <div class="divider"></div>
            <div id="gallery-grid" class="grid grid-cols-2 gap-2"></div>
        </section>

        <!-- UCAPAN -->
        <section id="ucapan-section" class="px-8 pb-24 hidden">
            <div class="divider"></div>
            <h3 id="judul-ucapan" class="serif text-3xl text-center mb-8">Ucapan</h3>

            <form id="form-ucapan" class="mb-12">
                <input type="text" id="nama-ucapan" placeholder="Nama" required class="w-full border-b border-gray-300 py-3 mb-4 text-sm bg-transparent focus:outline-none focus:border-black">
                <textarea id="isi-ucapan" placeholder="Ucapan" required rows="3" class="w-full border-b border-gray-300 py-3 mb-4 text-sm bg-transparent focus:outline-none focus:border-black resize-none"></textarea>
                <div class="flex gap-4 mb-6">
                    <select id="hadir-ucapan" class="flex-1 border-b border-gray-300 py-3 text-sm bg-transparent focus:outline-none">
                        <option value="Hadir">Hadir</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                    </select>
                    <input type="number" id="pax-ucapan" value="1" min="1" placeholder="Jumlah" class="w-20 border-b border-gray-300 py-3 text-sm bg-transparent focus:outline-none text-center">
                </div>
                <button type="submit" id="btn-kirim" class="btn w-full">Kirim</button>
            </form>

            <div id="list-ucapan"></div>
        </section>

        <!-- FOOTER -->
        <footer class="text-center py-16 border-t border-gray-200">
            <p id="footer-names" class="serif text-2xl"></p>
        </footer>

    </main>

    <script>
        const params = new URLSearchParams(window.location.search);
        const slug = params.get('c') || 'demo';
        const path = `../../public/clients/${slug}/`;

        const escapeHtml = (text) => {
          const div = document.createElement('div');
          div.textContent = text || '';
          return div.innerHTML;
        };

        document.getElementById('guest-name').innerText = (params.get('to') || 'Tamu Undangan').replace(/\+/g, ' ');

        fetch(`${path}data.json`).then(r => r.json()).then(data => {
            // DATA UTAMA
            const pair = `${data.couple.groom.nickname} & ${data.couple.bride.nickname}`;
            document.getElementById('names-cover').innerText = pair;
            document.getElementById('names-main').innerText = pair;
            document.getElementById('footer-names').innerText = pair;

            if (data.guest?.group) document.getElementById('guest-group').innerText = data.guest.group;

            // TANGGAL
            if (data.events[0]) {
                const d = new Date(data.events[0].date);
                document.getElementById('date-main').innerText = d.toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
            }

            // MEMPELAI
            document.getElementById('groom-img').src = path + data.couple.groom.image;
            document.getElementById('groom-name').innerText = data.couple.groom.name;
            document.getElementById('groom-parents').innerHTML = `Putra dari<br>${data.couple.groom.father} & ${data.couple.groom.mother}`;

            document.getElementById('bride-img').src = path + data.couple.bride.image;
            document.getElementById('bride-name').innerText = data.couple.bride.name;
            document.getElementById('bride-parents').innerHTML = `Putri dari<br>${data.couple.bride.father} & ${data.couple.bride.mother}`;

            // QUOTE
            if (data.quote) {
                document.getElementById('quote-section').classList.remove('hidden');
                if (data.quote.arab) {
                    document.getElementById('quote-arab').innerText = data.quote.arab;
                    document.getElementById('quote-arab').classList.remove('hidden');
                }
                document.getElementById('quote-text').innerText = data.quote.text;
                document.getElementById('quote-source').innerText = data.quote.source;
            }

            // EVENTS
            document.getElementById('events-list').innerHTML = data.events.map(e => `
                <div class="text-center mb-12">
                    <h4 class="serif text-2xl mb-3">${e.title}</h4>
                    <p class="text-sm mb-1">${new Date(e.date).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' })}</p>
                    <p class="text-xs text-gray-500 mb-4">${e.startTime} - ${e.endTime} ${e.timezone}</p>
                    <p class="text- text-gray-600 mb-6 leading-relaxed max-w-xs mx-auto">${e.address}</p>
                    <a href="${e.googleMaps}" target="_blank" class="btn inline-block">Lokasi</a>
                </div>
            `).join('');

            // COUNTDOWN
            if (data.settings?.showCountdown && data.countdown?.targetDate) {
                document.getElementById('countdown-section').classList.remove('hidden');
                const target = new Date(data.countdown.targetDate).getTime();
                setInterval(() => {
                    const diff = target - new Date().getTime();
                    if (diff > 0) {
                        document.getElementById('days').innerText = String(Math.floor(diff / (1000 * 60 * 60 * 24))).padStart(2, '0');
                        document.getElementById('hours').innerText = String(Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60))).padStart(2, '0');
                        document.getElementById('mins').innerText = String(Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60))).padStart(2, '0');
                        document.getElementById('secs').innerText = String(Math.floor((diff % (1000 * 60)) / 1000)).padStart(2, '0');
                    }
                }, 1000);
            }

            // GALLERY
            if (data.gallery?.album) {
                document.getElementById('gallery-section').classList.remove('hidden');
                document.getElementById('gallery-grid').innerHTML = data.gallery.album.map(img =>
                    `<img src="${path+img}" class="w-full aspect-square object-cover">`
                ).join('');
            }

            // UCAPAN
            if (data.fitur?.ucapan && data.link?.apiUcapan) {
                document.getElementById('ucapan-section').classList.remove('hidden');
                document.getElementById('judul-ucapan').innerText = data.teks?.ucapanJudul || 'Ucapan';

                const apiUrl = data.link.apiUcapan;
                const form = document.getElementById('form-ucapan');
                const list = document.getElementById('list-ucapan');
                const btn = document.getElementById('btn-kirim');

                const loadUcapan = async () => {
                    list.innerHTML = '<p class="text- text-gray-400 text-center">Memuat...</p>';
                    try {
                        const dataUcapan = await new Promise((resolve, reject) => {
                            const callbackName = 'jsonp_' + Math.round(100000 * Math.random());
                            window[callbackName] = (data) => {
                                delete window[callbackName];
                                document.body.removeChild(script);
                                resolve(data);
                            };
                            const script = document.createElement('script');
                            script.src = `${apiUrl}?c=${slug}&callback=${callbackName}`;
                            script.onerror = reject;
                            document.body.appendChild(script);
                        });

                        if (!dataUcapan.length) {
                            list.innerHTML = `<p class="text- text-gray-400 text-center py-8">${data.teks?.ucapanKosong || 'Belum ada ucapan'}</p>`;
                            return;
                        }
                        list.innerHTML = dataUcapan.map(u => `
                            <div class="border-b border-gray-200 py-6">
                                <div class="flex justify-between items-start mb-2">
                                    <b class="text-sm">${escapeHtml(u.nama)}</b>
                                    <span class="text- text-gray-500">${u.hadir} ${u.pax > 1? `(${u.pax})` : ''}</span>
                                </div>
                                <p class="text-sm leading-relaxed text-gray-700 mb-2">${escapeHtml(u.ucapan)}</p>
                                <p class="text- text-gray-400">${new Date(u.waktu).toLocaleDateString('id-ID', { day: 'numeric', month: 'short', year: 'numeric' })}</p>
                            </div>
                        `).join('');
                    } catch (e) {
                        list.innerHTML = '<p class="text- text-red-500 text-center">Gagal memuat</p>';
                    }
                };

                if (data.fitur.tampilkanUcapan!== false) loadUcapan();

                form.addEventListener('submit', async (e) => {
                    e.preventDefault();
                    btn.disabled = true;
                    btn.innerText = 'Mengirim...';
                    try {
                        await fetch(apiUrl, {
                            method: 'POST',
                            mode: 'no-cors',
                            body: JSON.stringify({
                                idKlien: slug,
                                nama: document.getElementById('nama-ucapan').value,
                                ucapan: document.getElementById('isi-ucapan').value,
                                hadir: document.getElementById('hadir-ucapan').value,
                                pax: document.getElementById('pax-ucapan').value
                            })
                        });
                        form.reset();
                        setTimeout(loadUcapan, 1000);
                    } catch (err) {
                        alert('Gagal mengirim');
                    }
                    btn.disabled = false;
                    btn.innerText = data.teks?.tombolKirim || 'Kirim';
                });
            }
        });

        function openInvitation() {
            document.getElementById('cover').style.display = 'none';
            document.getElementById('app').classList.remove('hidden');
        }
    </script>
</body>
</html>
