<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Omah Aksara — Royal Polaroid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Playfair+Display:ital,wght@0,400;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        :root { --marun: #6b0505; --gold: #c5a880; --bg: #fdfbf7; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; background: #e7e5e4; }
        .font-luxury { font-family: 'Cinzel', serif; }
        .font-serif { font-family: 'Playfair Display', serif; }
        .polaroid { background: white; padding: 15px 15px 40px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid rgba(197, 168, 128, 0.2); }
        .btn-luxury { background: linear-gradient(135deg, #7a0b0b, #540303); color: #fdfbf7; padding: 15px 40px; text-transform: uppercase; letter-spacing: 0.2em; font-family: 'Cinzel', serif; font-size: 12px; }
        .invitation-container { max-width: 448px; margin: 0 auto; background: #fdfbf7; min-height: 100vh; position: relative; overflow: hidden; border-left: 1px solid #e7e5e4; border-right: 1px solid #e7e5e4; }
    </style>
</head>
<body>

    <!-- COVER SECTION -->
    <div id="cover" class="fixed inset-0 z-50 flex flex-col items-center justify-between py-12 px-6 bg-[#fdfbf7] w-full max-w-md mx-auto border-x border-stone-200">
        <div class="text-center">
            <p class="font-serif italic text-stone-400 text-sm">The Wedding of</p>
        </div>
        <div class="polaroid w-[260px]">
            <img id="cover-img" src="https://placehold.co/400x500" class="w-full aspect-[4/5] object-cover">
        </div>
        <div class="text-center">
            <h1 id="cover-names" class="font-luxury text-2xl text-stone-800">Nama Pasangan</h1>
            <p class="font-serif italic text-stone-500 mt-2">Katur Dhumateng: <span id="guest-name" class="font-bold">Tamu Undangan</span></p>
        </div>
        <button onclick="openInvitation()" class="btn-luxury">Buka Undangan</button>
    </div>

    <!-- MAIN APP -->
    <main id="app" class="invitation-container opacity-0 transition-opacity duration-1000">
        <section class="p-10 text-center space-y-10">
            <h2 class="font-luxury text-xl">Mempelai Pasangan</h2>
            
            <div id="groom-box" class="space-y-4">
                <div class="polaroid w-48 mx-auto rotate-[-2deg]"><img src="https://placehold.co/400x400"></div>
                <p class="font-luxury font-bold">Mempelai Pria</p>
            </div>

            <div class="font-serif text-3xl text-[#c5a880] italic">&</div>

            <div id="bride-box" class="space-y-4">
                <div class="polaroid w-48 mx-auto rotate-[2deg]"><img src="https://placehold.co/400x400"></div>
                <p class="font-luxury font-bold">Mempelai Wanita</p>
            </div>
        </section>

        <section class="bg-[#6b0505] text-stone-100 p-10 text-center">
            <h2 class="font-luxury text-xl mb-6">Waktu & Tempat</h2>
            <p class="font-serif italic">Detail acara akan tampil di sini.</p>
        </section>
    </main>

    <script>
        function openInvitation() {
            // Animasi Cover naik ke atas
            gsap.to("#cover", { y: "-100%", duration: 1.2, ease: "power4.inOut", onComplete: () => {
                document.getElementById('cover').style.display = 'none';
            }});
            // Fade in Main App
            document.getElementById('app').classList.remove('opacity-0');
        }
    </script>
</body>
</html>
