<script>
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'yaya-oci';
    const guestName = params.get('to')?.replace(/\+/g,' ') || 'Tamu Undangan';
    const basePath = `../../public/clients/${clientSlug}/`;
    // INI KUNCI: PAKAI URL YANG 1 SHEET SEMUA KLIEN
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzbrMzVWSHCF9u8I1FbY4h4i_GoxL6kvTbFxFrcZ-VG9_qun2wK0c4mIupBKiGk1Yvmw/exec';

    // ... data.json load tetap sama kayak kamu ...

    // GANTI fungsi loadGoogleSheetsWishes jadi JSONP kayak template 0
    function loadGoogleSheetsWishes() {
        const wishesBox = document.getElementById('wishes-box');
        wishesBox.innerHTML = `<p class="text-xs text-stone-500 text-center py-4 italic animate-pulse">Memuat data ucapan...</p>`;
        const callbackName = 'jsonp_callback_' + Math.round(100000 * Math.random());
        window[callbackName] = function(wishes) {
            delete window[callbackName];
            document.body.removeChild(script);
            allWishes = wishes || [];
            currentPage = 1;
            renderWishes();
        };
        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?id_klien=${encodeURIComponent(clientSlug)}&callback=${callbackName}&t=${Date.now()}`;
        script.onerror = function() {
            wishesBox.innerHTML = `<p class="text-xs text-red-400 text-center">Gagal load ucapan. Deploy Apps Script = Anyone.</p>`;
        };
        document.body.appendChild(script);
    }

    // GANTI submit jadi JSON + no-cors
    document.getElementById('wishes-form').addEventListener('submit', function(e){
        e.preventDefault();
        const btn = document.getElementById('submit-btn');
        btn.innerText = "Mengirim..."; btn.disabled = true;
        const payload = {
            id_klien: clientSlug,
            nama: document.getElementById('wish-name').value,
            ucapan: document.getElementById('wish-message').value,
            kehadiran: document.getElementById('wish-status').value,
            jumlah_tamu: document.getElementById('wish-pax').value
        };
        fetch(SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) })
        .then(() => {
            document.getElementById('wishes-form').reset();
            showToast('Ucapan terkirim!');
            setTimeout(loadGoogleSheetsWishes, 2000);
        })
        .catch(()=> showToast('Gagal kirim', true))
        .finally(()=> { btn.innerText='Kirim Konfirmasi Kehadiran'; btn.disabled=false; });
    });
</script>
