<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Karsa — Polaroid Gen Z</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <!-- FONT GEN Z: Gochi Hand + Outfit -->
    <link href="https://fonts.googleapis.com/css2?family=Gochi+Hand&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --theme-color: #D4A5A5; /* Dusty pink */
            --bg-color: #FEF9F3; /* Cream */
            --text-color: #3C3C3C;
            --soft-color: #EFE3D7;
            --white-soft: #FFFFFF;
            --sage: #B4C4B9;
            --tape: rgba(255,255,255,0.7);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Outfit', sans-serif;
            overflow-x: hidden;
            line-height: 1.7;
            background-image:
                radial-gradient(circle at 20% 80%, rgba(212,165,0.08) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(180,196,185,0.08) 0%, transparent 50%);
        }

       .font-hand { font-family: 'Gochi Hand', cursive; }
       .font-body { font-family: 'Outfit', sans-serif; }

       .reveal { opacity: 0; transform: translateY(30px) rotate(-1deg); transition: all 0.8s ease; }
       .reveal.active { opacity: 1; transform: translateY(0) rotate(0deg); }

        /* COVER POLAROID STYLE */
        #cover {
            transition: transform 1.5s cubic-bezier(0.76, 0, 0.24, 1), opacity 1.5s;
            background: linear-gradient(135deg, #FEF9F3 0%, #F5E6E8 100%);
        }
       .polaroid-cover {
            background: white;
            padding: 20px 20px 80px 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.15);
            transform: rotate(-2deg);
            position: relative;
        }
       .polaroid-cover::before {
            content: '';
            position: absolute;
            top: -10px;
            left: 50%;
            transform: translateX(-50%) rotate(5deg);
            width: 80px;
            height: 25px;
            background: var(--tape);
            opacity: 0.8;
        }
       .polaroid-cover img {
            width: 280px;
            height: 320px;
            object-fit: cover;
        }

       .btn-open {
            background: var(--theme-color);
            color: white;
            padding: 14px 32px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            transform: rotate(-1deg);
            box-shadow: 0 8px 20px rgba(212,165,165,0.4);
        }
       .btn-open:hover {
            transform: rotate(0deg) scale(1.05);
            background: #C88EA7;
        }

       .phone-wrapper {
            max-width: 425px;
            margin: 0 auto;
            background: var(--white-soft);
            position: relative;
            min-height: 100vh;
        }

        /* POLAROID FRAME */
       .polaroid {
            background: white;
            padding: 12px 12px 50px 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.08);
            position: relative;
            transform: rotate(-1deg);
            transition: all 0.3s ease;
        }
       .polaroid:hover { transform: rotate(0deg) scale(1.02); }
       .polaroid::after {
            content: '';
            position: absolute;
            top: -8px;
            right: 20px;
            width: 60px;
            height: 20px;
            background: var(--tape);
            transform: rotate(8deg);
            opacity: 0.9;
        }
       .polaroid img { width: 100%; aspect-ratio: 1; object-fit: cover; }

        /* BINGKAI BULAT GEN Z */
       .circle-frame {
            width: 160px;
            height: 160px;
            border-radius: 50%;
            padding: 8px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            position: relative;
            margin: 0 auto;
        }
       .circle-frame::before {
            content: '';
            position: absolute;
            inset: -4px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--theme-color), var(--sage));
            z-index: -1;
        }
       .circle-frame img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
        }
       .circle-frame.tape {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%) rotate(-5deg);
            width: 50px;
            height: 18px;
            background: var(--tape);
        }

        /* STICKER ELEMENT */
       .sticker {
            display: inline-block;
            background: var(--sage);
            color: white;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 500;
            transform: rotate(-2deg);
        }

        /* GALLERY PINTEREST STYLE */
       .masonry {
            column-count: 2;
            column-gap: 8px;
        }
       .masonry-item {
            break-inside: avoid;
            margin-bottom: 8px;
            position: relative;
        }
       .masonry-item img {
            width: 100%;
            border-radius: 12px;
            display: block;
        }
       .masonry-item.polaroid-small {
            background: white;
            padding: 8px 8px 30px 8px;
            border-radius: 2px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.06);
        }

        /* TIMELINE POLAROID */
       .timeline-polaroid {
            position: relative;
            margin-bottom: 40px;
        }
       .timeline-polaroid:nth-child(even) { transform: rotate(1deg); }
       .timeline-polaroid:nth-child(odd) { transform: rotate(-1deg); }

       .btn-cute {
            background: var(--theme-color);
            color: white;
            padding: 12px 28px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            transition: all 0.3s ease;
            display: inline-block;
        }
       .btn-cute:hover {
            background: #C88EA7;
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(212,165,165,0.4);
        }

        /* MUSIC PLAYER CUTE */
       .music-player {
            position: fixed;
            bottom: 30px;
            right: calc(50% - 190px);
            z-index: 90;
            background: white;
            border-radius: 50px;
            padding: 10px 16px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            gap: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        @media (max-width: 435px) {.music-player { right: 20px; } }
       .music-player:hover { transform: scale(1.05); }
       .music-disk {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: linear-gradient(45deg, var(--theme-color), var(--sage));
            animation: spin 3s linear infinite;
        }
       .music-disk.paused { animation-play-state: paused; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* DOODLE LINE */
       .doodle-line {
            height: 2px;
            background: url("data:image/svg+xml,%3Csvg width='100' height='2' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0 1 Q 25 0, 50 1 T 100 1' stroke='%23D4A5A5' fill='none' stroke-width='2'/%3E%3C/svg%3E");
            width: 60px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
<!-- COVER -->
<section id="cover" class="fixed inset-0 z-[100] flex items-center justify-center overflow-hidden">
    <div class="text-center px-6">
        <div class="polaroid-cover mb-8 mx-auto w-fit">
            <img id="cover-image" src="" crossorigin="anonymous">
            <p class="font-hand text-2xl mt-4 text-stone-700" id="cover-names"></p>
        </div>

        <p class="font-body text-sm text-stone-600 mb-1">Hai,</p>
        <h2 id="cover-guest" class="font-hand text-3xl text-stone-800 mb-8"></h2>

        <button id="open-btn" class="btn-open font-body">
            <i class="fa-solid fa-envelope-open-heart mr-2"></i>Buka Undangan
        </button>
    </div>
</section>

<!-- MAIN APP -->
<main id="app" class="phone-wrapper opacity-0 pb-1">
    <!-- HERO -->
    <section class="relative pt-16 pb-12 px-6 text-center overflow-hidden">
        <div class="absolute top-4 right-4 text-4xl opacity-20 rotate-12">✨</div>
        <div class="absolute bottom-8 left-4 text-3xl opacity-20 -rotate-12">💕</div>

        <p class="font-hand text-2xl text-[var(--theme-color)] mb-2">we're getting married!</p>
        <div class="doodle-line"></div>
        <h1 id="hero-names" class="font-hand text-5xl text-stone-800 mb-6"></h1>

        <div class="polaroid mx-auto w-64 mb-8">
            <img id="hero-image" src="">
        </div>
    </section>

    <!-- QUOTE -->
    <section class="px-8 py-16 text-center reveal">
        <div class="sticker mb-4">Our Verse</div>
        <p id="quote-arab" class="font-body text-xl mb-4 text-stone-700 leading-relaxed"></p>
        <p id="quote-text" class="font-hand text-xl text-[var(--theme-color)]"></p>
        <p id="quote-source" class="text-xs text-stone-400 mt-3"></p>
    </section>

    <!-- COUPLE -->
    <section class="py-16 px-6 bg-gradient-to-b from-white to-[#FEF9F3]">
        <div class="text-center mb-12 reveal">
            <span class="font-hand text-3xl text-stone-700">The Bride & Groom</span>
            <div class="doodle-line"></div>
        </div>

        <!-- GROOM -->
        <div id="groom-section" class="mb-16 text-center reveal"></div>

        <div class="text-center my-8">
            <span class="font-hand text-4xl text-[var(--theme-color)]">&</span>
        </div>

        <!-- BRIDE -->
        <div id="bride-section" class="text-center reveal"></div>
    </section>

    <!-- LOVE STORY -->
    <section id="story-section" class="py-20 px-6 hidden">
        <div class="text-center mb-12 reveal">
            <div class="sticker mb-3">Love Journey</div>
            <h3 class="font-hand text-4xl text-stone-800">Our Story</h3>
        </div>
        <div id="story-list" class="space-y-8"></div>
    </section>

    <!-- EVENT -->
    <section id="event-section" class="py-20 px-6 bg-white hidden">
        <div class="text-center mb-12 reveal">
            <div class="sticker mb-3">Save The Date</div>
            <h3 class="font-hand text-4xl text-stone-800">Wedding Day</h3>
        </div>
        <div id="event-list" class="space-y-6"></div>

        <div id="countdown-wrap" class="mt-16 text-center hidden">
            <p class="font-hand text-2xl text-[var(--theme-color)] mb-6">Counting days...</p>
            <div id="countdown" class="flex justify-center gap-4"></div>
        </div>
    </section>

    <!-- GALLERY PINTEREST -->
    <section id="gallery-section" class="py-20 px-4 bg-[#FEF9F3] hidden">
        <div class="text-center mb-10 px-4 reveal">
            <div class="sticker mb-3">Memories</div>
            <h3 class="font-hand text-4xl text-stone-800">Our Gallery</h3>
        </div>
        <div id="gallery-grid" class="masonry"></div>
    </section>

    <!-- GIFT -->
    <section id="gift-section" class="py-20 px-6 bg-white hidden">
        <div class="text-center mb-12 reveal">
            <div class="sticker mb-3">Wedding Gift</div>
            <h3 class="font-hand text-4xl text-stone-800">Send Love</h3>
        </div>
        <div id="gift-container" class="space-y-4"></div>
    </section>

    <!-- RSVP -->
    <section id="rsvp-section" class="py-20 px-6 bg-[#FEF9F3]">
        <div class="max-w-md mx-auto">
            <div class="text-center mb-10 reveal">
                <div class="sticker mb-3">RSVP</div>
                <h3 class="font-hand text-4xl text-stone-800">Say Something Sweet</h3>
            </div>

            <form id="wishes-form" class="bg-white p-6 rounded-3xl shadow-lg mb-10 space-y-4">
                <input type="text" id="wish-name" required placeholder="Nama kamu..." class="w-full bg-[#FEF9F3] border-0 rounded-2xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--theme-color)]">

                <div class="grid grid-cols-2 gap-3">
                    <select id="wish-status" class="w-full bg-[#FEF9F3] border-0 rounded-2xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--theme-color)]">
                        <option value="Hadir">Hadir ✨</option>
                        <option value="Tidak Hadir">Berhalangan 🙏</option>
                    </select>
                    <select id="wish-pax" class="w-full bg-[#FEF9F3] border-0 rounded-2xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--theme-color)]">
                        <option value="1">1 orang</option>
                        <option value="2">2 orang</option>
                        <option value="3">3 orang</option>
                        <option value="4">4 orang</option>
                    </select>
                </div>

                <textarea id="wish-message" required rows="3" placeholder="Tulis ucapan/doa..." class="w-full bg-[#FEF9F3] border-0 rounded-2xl py-3 px-4 text-sm focus:outline-none focus:ring-2 focus:ring-[var(--theme-color)] resize-none"></textarea>

                <button type="submit" class="w-full btn-cute">
                    <i class="fa-solid fa-paper-plane mr-2"></i>Kirim Ucapan
                </button>
            </form>

            <div class="bg-white rounded-3xl p-6 shadow-lg">
                <p class="font-hand text-xl text-center text-stone-700 mb-6">Ucapan Teman-teman</p>
                <div id="wishes-box" class="space-y-4 max-h-80 overflow-y-auto"></div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer class="py-20 bg-gradient-to-b from-white to-[#F5E6E8] text-center px-6">
        <p class="font-hand text-2xl text-[var(--theme-color)] mb-4">Thank you!</p>
        <h2 id="footer-names" class="font-hand text-4xl text-stone-800 mb-8"></h2>
        <div class="doodle-line"></div>
        <p class="text-xs text-stone-400 font-body">Made with 💕 by Omah Aksara</p>
    </footer>
</main>

<!-- MUSIC PLAYER -->
<div id="music-btn" class="music-player hidden">
    <div id="disk-wrap" class="music-disk"></div>
    <div>
        <p class="text-xs font-medium text-stone-700">Now Playing</p>
        <p class="text- text-stone-400">Tap to pause</p>
    </div>
</div>
<audio id="audio" loop></audio>

<script>
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'afif-sindi';
    const guestName = params.get('to')?.replace(/\+/g,' ') || 'Bestie';
    const basePath = `../../public/clients/${clientSlug}/`;
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzbrMzVWSHCF9u8I1FbY4h4i_GoxL6kvTbFxFrcZ-VG9_qun2wK0c4mIupBKiGk1Yvmw/exec';

    fetch(`${basePath}data.json`, { cache: 'no-store' })
  .then(res => {
        if(!res.ok) throw new Error(`data.json tidak ditemukan. Cek: ${basePath}data.json`);
        return res.json();
    })
  .then(data => {
        const { couple, settings, events, gallery, loveStory, quote, logistics, music, digitalGift } = data;
        const pairNick = `${couple.groom.nickname} & ${couple.bride.nickname}`;

        // SET THEME
        if(settings?.themeColor) document.documentElement.style.setProperty('--theme-color', settings.themeColor);
        if(settings?.bgColor) document.documentElement.style.setProperty('--bg-color', settings.bgColor);

        // BASIC INFO
        document.getElementById('cover-names').innerText = pairNick;
        document.getElementById('hero-names').innerText = pairNick;
        document.getElementById('footer-names').innerText = pairNick;
        document.getElementById('cover-guest').innerText = guestName;

        // IMAGES
        document.getElementById('hero-image').src = basePath + gallery.heroImage;
        document.getElementById('cover-image').src = basePath + gallery.heroImage;
        document.getElementById('hero-image').onerror = function() { this.src = 'https://placehold.co/400x400/f0e6e6/a67c7c?text=Us'; };
        document.getElementById('cover-image').onerror = function() { this.src = 'https://placehold.co/280x320/f0e6e6/a67c7c?text=Us'; };

        // QUOTE
        if(quote?.text) {
            document.getElementById('quote-arab').textContent = quote.arab || '';
            document.getElementById('quote-text').innerHTML = `" ${quote.text} "`;
            document.getElementById('quote-source').textContent = quote.source || '';
        }

        // COUPLE - BINGKAI BULAT
        document.getElementById('groom-section').innerHTML = `
            <div class="circle-frame reveal">
                <div class="tape"></div>
                <img src="${basePath + couple.groom.image}" onerror="this.src='https://placehold.co/160x160?text=Groom'">
            </div>
            <div class="mt-6">
                <p class="sticker mb-2">The Groom</p>
                <h4 class="font-hand text-3xl text-stone-800 mb-1">${couple.groom.name}</h4>
                <p class="text-xs text-stone-500">Putra dari Bapak ${couple.groom.father} & Ibu ${couple.groom.mother}</p>
                ${couple.groom.instagram? `<a href="https://instagram.com/${couple.groom.instagram.replace('@','')}" target="_blank" class="inline-block mt-3 text-sm text-[var(--theme-color)]"><i class="fa-brands fa-instagram mr-1"></i>${couple.groom.instagram}</a>` : ''}
            </div>`;

        document.getElementById('bride-section').innerHTML = `
            <div class="circle-frame reveal">
                <div class="tape"></div>
                <img src="${basePath + couple.bride.image}" onerror="this.src='https://placehold.co/160x160?text=Bride'">
            </div>
            <div class="mt-6">
                <p class="sticker mb-2">The Bride</p>
                <h4 class="font-hand text-3xl text-stone-800 mb-1">${couple.bride.name}</h4>
                <p class="text-xs text-stone-500">Putri dari Bapak ${couple.bride.father} & Ibu ${couple.bride.mother}</p>
                ${couple.bride.instagram? `<a href="https://instagram.com/${couple.bride.instagram.replace('@','')}" target="_blank" class="inline-block mt-3 text-sm text-[var(--theme-color)]"><i class="fa-brands fa-instagram mr-1"></i>${couple.bride.instagram}</a>` : ''}
            </div>`;

        // EVENTS
        if(events?.length && settings.showCountdown) {
            document.getElementById('event-section').classList.remove('hidden');
            document.getElementById('event-list').innerHTML = '';
            events.forEach(ev => {
                document.getElementById('event-list').innerHTML += `
                    <div class="bg-white rounded-3xl p-6 text-center shadow-lg reveal" style="transform: rotate(-0.5deg);">
                        <h5 class="font-hand text-3xl text-stone-800 mb-2">${ev.title}</h5>
                        <p class="text-xs font-medium text-[var(--theme-color)] mb-4">${new Date(ev.date).toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
                        <div class="text-sm text-stone-600 space-y-1 mb-5">
                            <p class="font-medium">${ev.startTime} — ${ev.endTime} ${ev.timezone || 'WITA'}</p>
                            <p class="text-xs px-4 leading-relaxed">${ev.address}</p>
                        </div>
                        <a href="${ev.googleMaps}" target="_blank" class="btn-cute">
                            <i class="fa-solid fa-location-dot mr-2"></i>Buka Maps
                        </a>
                    </div>`;
            });

            // COUNTDOWN
            const tzMap = { WITA: '+08:00', WIB: '+07:00', WIT: '+09:00' };
            const tz = tzMap[events[0].timezone] || '+08:00';
            const targetTime = new Date(`${events[0].date}T${events[0].startTime}:00${tz}`).getTime();
            setInterval(() => {
                const now = new Date().getTime();
                const diff = targetTime - now;
                const d = Math.max(0, Math.floor(diff / (1000*60*60*24)));
                const h = Math.max(0, Math.floor((diff % (1000*60*60*24)) / (1000*60*60)));
                const m = Math.max(0, Math.floor((diff % (1000*60*60)) / (1000*60)));
                const s = Math.max(0, Math.floor((diff % (1000*60)) / 1000));
                document.getElementById('countdown').innerHTML = `
                    <div class="bg-white rounded-2xl p-4 shadow-md min-w-16"><span class="block font-hand text-2xl text-stone-800">${d}</span><span class="text- text-stone-400 uppercase mt-1 block">Hari</span></div>
                    <div class="bg-white rounded-2xl p-4 shadow-md min-w-16"><span class="block font-hand text-2xl text-stone-800">${h}</span><span class="text- text-stone-400 uppercase mt-1 block">Jam</span></div>
                    <div class="bg-white rounded-2xl p-4 shadow-md min-w-16"><span class="block font-hand text-2xl text-stone-800">${m}</span><span class="text- text-stone-400 uppercase mt-1 block">Menit</span></div>
                    <div class="bg-white rounded-2xl p-4 shadow-md min-w-16"><span class="block font-hand text-2xl text-stone-800">${s}</span><span class="text- text-stone-400 uppercase mt-1 block">Detik</span></div>`;
            }, 1000);
            document.getElementById('countdown-wrap').classList.remove('hidden');
        }

        // LOVE STORY - POLAROID
        if(loveStory?.length && settings.showLoveStory) {
            document.getElementById('story-section').classList.remove('hidden');
            document.getElementById('story-list').innerHTML = '';
            loveStory.forEach(ls => {
                document.getElementById('story-list').innerHTML += `
                    <div class="timeline-polaroid reveal">
                        <div class="polaroid">
                            ${ls.image? `<img src="${basePath + ls.image}" onerror="this.style.display='none'">` : '<div class="w-full aspect-square bg-[#FEF9F3]"></div>'}
                            <div class="mt-3 px-1">
                                <p class="text- text-[var(--theme-color)] font-medium">${ls.date || ls.year}</p>
                                <h6 class="font-hand text-xl text-stone-800 mb-1">${ls.title}</h6>
                                <p class="text-xs text-stone-500 leading-relaxed">${ls.description}</p>
                            </div>
                        </div>
                    </div>`;
            });
        }

        // GALLERY PINTEREST
        if(gallery?.album?.length && settings.showGallery) {
            document.getElementById('gallery-section').classList.remove('hidden');
            document.getElementById('gallery-grid').innerHTML = '';
            gallery.album.forEach((img, i) => {
                const isPolaroid = i % 3 === 0; // Random polaroid
                document.getElementById('gallery-grid').innerHTML += `
                    <div class="masonry-item ${isPolaroid? 'polaroid-small' : ''} reveal">
                        <img src="${basePath + img}" loading="lazy" onerror="this.parentElement.style.display='none'">
                    </div>`;
            });
        }

        // GIFT
        if(digitalGift?.accounts?.length && settings.showGift) {
            document.getElementById('gift-section').classList.remove('hidden');
            document.getElementById('gift-container').innerHTML = '';
            digitalGift.accounts.forEach((bank, i) => {
                document.getElementById('gift-container').innerHTML += `
                    <div class="bg-white rounded-3xl p-6 text-center shadow-lg reveal">

            document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
        };
