<script>
    // GLOBAL VARIABLE - AUTO UNTUK SEMUA KLIEN
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'demo';
    const guest = params.get('to')?.replace(/\+/g, ' ') || 'Tamu Undangan';
    const path = `../../public/clients/${clientSlug}/`;
    let SCRIPT_URL = '';
    let dataGlobal = {};

    // LOAD MASTER JSON - AUTO JALAN BUAT SEMUA KLIEN
    fetch(`${path}data.json`)
   .then(res => {
        if (!res.ok) throw new Error('data.json tidak ditemukan');
        return res.json();
    })
   .then(data => {
        dataGlobal = data;
        SCRIPT_URL = data.link.apiUcapan; // AMBIL DARI JSON OTOMATIS

        // SET SEO
        document.getElementById('page-title').textContent = data.seo.title;

        // SET THEME COLOR
        if(data.settings.themeColor) {
            document.documentElement.style.setProperty('--marun', data.settings.themeColor);
        }

        const pair = `${data.couple.groom.nickname} & ${data.couple.bride.nickname}`;
        document.getElementById('cover-names').textContent = pair;
        document.getElementById('footer-names').textContent = pair;
        document.getElementById('guest-name').textContent = guest;
        document.getElementById('ticket-guest-name').textContent = guest;
        document.getElementById('cover-img').src = path + data.gallery.heroImage;
        document.getElementById('quote-text').textContent = data.quote.text;
        document.getElementById('quote-source').textContent = data.quote.source;

        if(data.settings.islami) {
            document.getElementById('islamic-greeting').classList.remove('hidden');
        }

        // Hide section based on settings
        if(!data.settings.showCountdown) document.getElementById('countdown-wrap').style.display = 'none';
        if(!data.settings.showLoveStory) document.getElementById('love-story-section').style.display = 'none';
        if(!data.settings.showUcapan) document.getElementById('rsvp-section').style.display = 'none';

        document.getElementById('footer-note').textContent = data.logistics.noteFooter;
        document.getElementById('guest-note').textContent = data.logistics.guestNote;

        // Set WA RSVP
        if(data.logistics.rsvpWaNumber) {
            document.getElementById('rsvp-link').href = `https://wa.me/${data.logistics.rsvpWaNumber}?text=Assalamualaikum,%20saya%20${encodeURIComponent(guest)}%20konfirmasi%20kehadiran%20untuk%20acara%20${encodeURIComponent(pair)}.`;
        }

        // Countdown
        const firstEvent = data.events[0];
        const mainEventDateStr = new Date(firstEvent.date).toLocaleDateString('id-ID', {day:'numeric', month:'long', year:'numeric'});
        document.getElementById('ticket-date').innerText = mainEventDateStr;

        const eventTime = new Date(data.countdown.targetDate).getTime();
        setInterval(() => {
            const diff = eventTime - new Date().getTime();
            if (diff > 0) {
                document.getElementById('days').innerText = Math.floor(diff / 864e5).toString().padStart(2, '0');
                document.getElementById('hours').innerText = Math.floor((diff % 864e5) / 36e5).toString().padStart(2, '0');
                document.getElementById('minutes').innerText = Math.floor((diff % 36e5) / 6e4).toString().padStart(2, '0');
            }
        }, 1000);

        // Couple Render
        const renderCouple = (p, target, rotation, genderRole) => {
            document.getElementById(target).innerHTML = `
                <div class="polaroid mb-6" style="--rotation: ${rotation}; width: 250px;">
                    <img src="${path + p.image}">
                    <div class="polaroid-text">${p.nickname}</div>
                </div>
                <h4 class="font-luxury text-lg font-bold text-stone-800 tracking-wide">${p.name}</h4>
                ${p.instagram? `<a href="https://instagram.com/${p.instagram.replace('@','')}" target="_blank" class="text- uppercase tracking-widest text-[#6b0505] mt-1 font-bold block"><i class="fa-brands fa-instagram mr-1"></i>${p.instagram}</a>` : ''}
                <p class="text- text-center max-w- tracking-widest opacity-50 mt-4 font-medium leading-relaxed">
                    ${genderRole}<br><span class="text-stone-800 font-semibold">${p.father}</span><br>&<br><span class="text-stone-800 font-semibold">${p.mother}</span>
                </p>`;
        };

        renderCouple(data.couple.groom, 'groom-box', '1.5deg', 'Putra dari:');
        renderCouple(data.couple.bride, 'bride-box', '-1.5deg', 'Putri dari:');

        // Love Story + Gallery
        data.loveStory.forEach((story, i) => {
            const rot = i % 2 === 0? '-2.5deg' : '2.5deg';
            document.getElementById('gallery-grid').innerHTML += `
                <div class="reveal flex flex-col items-center">
                    <div class="polaroid" style="--rotation: ${rot}; width: 270px;">
                        <img src="${path + story.image}">
                        <div class="polaroid-text" style="font-size: 1.1rem;">${story.title}</div>
                    </div>
                    <p class="text-xs text-stone-500 text-center px-10 mt-6 opacity-80 leading-relaxed italic font-light">${story.description}</p>
                </div>`;
        });

        // Events
        data.events.forEach(e => {
            document.getElementById('event-list').innerHTML += `
                <div class="reveal px-4 border border-white/10 py-8 bg-black/10 rounded backdrop-blur-sm">
                    <p class="text- tracking-[0.4em] font-bold uppercase mb-4 text-[#c5a880]">${e.title}</p>
                    <p class="font-luxury text-xl font-normal mb-2 tracking-wide text-white">${new Date(e.date).toLocaleDateString('id-ID', {weekday: 'long', day:'numeric', month:'long', year:'numeric'})}</p>
                    <p class="text-xs font-mono opacity-90 mb-6 tracking-widest text-stone-200">${e.startTime} - ${e.endTime} ${e.timezone}</p>
                    <div class="w-4 h-px bg-[#c5a880]/40 mx-auto mb-6"></div>
                    <p class="text-xs font-light opacity-80 leading-relaxed mb-8 px-6 text-stone-300 font-serif italic">${e.address}</p>
                    <a href="${e.googleMaps}" target="_blank" class="inline-block border border-[#c5a880]/50 px-8 py-3 text- tracking-[0.3em] uppercase font-bold text-[#c5a880] bg-transparent hover:bg-[#c5a880] hover:text-stone-900 transition-all duration-400">Buka Peta</a>
                </div>`;
        });

        // Music
        window.musicFile = path + data.logistics.music;

        // LOAD UCAPAN - AUTO JALAN KALAU ADA URL
        if(data.settings.showUcapan && SCRIPT_URL) {
            loadGoogleSheetsWishes();
        }

    }).catch(err => {
        console.error('Gagal load data.json:', err);
        document.body.innerHTML = '<div class="text-center p-10 text-red-600">Gagal memuat undangan. Pastikan URL?c=nama-klien sudah benar.</div>';
    });

    // LOAD UCAPAN FUNCTION - JSONP UNIVERSAL + FIX ERROR
    function loadGoogleSheetsWishes() {
        const wishesBox = document.getElementById('wishes-box');
        if (!wishesBox ||!SCRIPT_URL) {
            console.error('SCRIPT_URL kosong. Cek data.json -> link.apiUcapan');
            return;
        }

        wishesBox.innerHTML = `<p class="text- text-stone-400 text-center py-4 font-light italic animate-pulse">Menyelaraskan doa restu...</p>`;

        const callbackName = 'jsonp_wishes_' + Date.now();
        window[callbackName] = (wishes) => {
            wishesBox.innerHTML = '';

            if (!wishes || wishes.error) {
                wishesBox.innerHTML = `<p class="text- text-red-400/80 text-center py-4 font-light italic">Error: ${wishes.error || 'Data kosong'}</p>`;
                delete window[callbackName];
                return;
            }

            if (wishes.length === 0) {
                wishesBox.innerHTML = `<p class="text- text-stone-400 text-center py-4 font-light italic">Belum ada ucapan tertulis. Berikan doa restu pertama Anda.</p>`;
                delete window[callbackName];
                return;
            }

            wishes.forEach(wish => {
                const badgeColor = wish.hadir === 'Hadir'
               ? 'bg-stone-100 text-stone-600 border border-stone-200'
                  : 'bg-stone-50 text-stone-400 border border-stone-100';

                let displayTime = '';
                if(wish.waktu) {
                    const dateObj = new Date(wish.waktu);
                    displayTime = isNaN(dateObj)? wish.waktu : dateObj.toLocaleDateString('id-ID', {day:'numeric', month:'short', hour:'2-digit', minute:'2-digit'});
                }

                wishesBox.innerHTML += `
                    <div class="p-4 bg-stone-50/60 border border-stone-200/40 rounded space-y-1 text-left reveal active">
                        <div class="flex items-center justify-between">
                            <p class="text-xs font-semibold text-stone-800">${wish.nama}</p>
                            <span class="text- px-2 py-0.5 rounded font-bold uppercase tracking-wider ${badgeColor}">${wish.hadir}</span>
                        </div>
                        <p class="text-xs text-stone-600 font-light leading-relaxed whitespace-pre-line pt-1">${wish.ucapan}</p>
                        <p class="text- text-stone-400 font-mono text-right pt-1">${displayTime}</p>
                    </div>`;
            });
            delete window[callbackName];
        };

        const script = document.createElement('script');
        script.src = `${SCRIPT_URL}?c=${encodeURIComponent(clientSlug)}&callback=${callbackName}`;
        script.onerror = () => {
            wishesBox.innerHTML = `<p class="text- text-red-400/80 text-center py-4 font-light italic">Gagal konek ke server ucapan. Cek URL API.</p>`;
            delete window[callbackName];
        };
        document.body.appendChild(script);
    }

    // FORM SUBMIT - UNIVERSAL
    document.getElementById('wishes-form')?.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (!SCRIPT_URL) {
            alert('API Ucapan belum dikonfigurasi di data.json');
            return;
        }

        const btn = e.target.querySelector('button[type="submit"]');
        btn.disabled = true;
        btn.innerText = 'Mengirim...';

        const payload = {
            idKlien: clientSlug, // OTOMATIS AMBIL DARI URL?c=
            nama: document.getElementById('wish-name').value.trim(),
            hadir: document.getElementById('wish-status').value,
            pax: parseInt(document.getElementById('wish-pax').value) || 1,
            ucapan: document.getElementById('wish-message').value.trim()
        };

        if(!payload.nama ||!payload.ucapan) {
            alert('Nama dan ucapan wajib diisi');
            btn.disabled = false;
            btn.innerText = 'Kirim Konfirmasi Online';
            return;
        }

        try {
            const res = await fetch(SCRIPT_URL, {
                method: 'POST',
                mode: 'no-cors', // PENTING BIAR GAK CORS ERROR
                headers: {'Content-Type': 'text/plain;charset=utf-8'},
                body: JSON.stringify(payload)
            });
            // Karena no-cors, kita gak bisa baca response. Anggap sukses aja
            alert('Matur nuwun, ucapan sudah terkirim!');
            e.target.reset();
            setTimeout(() => loadGoogleSheetsWishes(), 2000); // tunggu 2 detik baru reload
        } catch(err) {
            alert('Gagal kirim ucapan. Coba lagi.');
            console.error(err);
        } finally {
            btn.disabled = false;
            btn.innerText = 'Kirim Konfirmasi Online';
        }
    });

    // OPEN INVITATION
    function openInvitation() {
        const audio = document.getElementById('audio');
        if(window.musicFile) audio.src = window.musicFile;

        audio.play().then(() => {
            document.getElementById('music-icon-state').className = "fa-solid fa-pause text- text-stone-600";
        }).catch(e => console.log("Autoplay blocked"));

        const musicBtn = document.getElementById('music-btn');
        const diskWrap = document.getElementById('disk-wrap');
        const stateIcon = document.getElementById('music-icon-state');
        musicBtn.classList.remove('hidden');

        musicBtn.onclick = () => {
            if(audio.paused) {
                audio.play();
                diskWrap.classList.remove('paused');
                stateIcon.className = "fa-solid fa-pause text- text-stone-600";
            } else {
                audio.pause();
                diskWrap.classList.add('paused');
                stateIcon.className = "fa-solid fa-play text- text-stone-600";
            }
        };

        gsap.to("#cover", { y: "-100%", duration: 1.4, ease: "power4.inOut", onComplete: () => {
            document.getElementById('cover').style.display = 'none';
            document.getElementById('app').style.opacity = '1';

            const obs = new IntersectionObserver(ents => {
                ents.forEach(en => { if(en.isIntersecting) en.target.classList.add('active'); });
            }, { threshold: 0.05 });
            document.querySelectorAll('.reveal').forEach(el => obs.observe(el));
        }});
    }
</script>
