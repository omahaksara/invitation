<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Undangan Eksklusif — Omah Aksara</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600&family=Pinyon+Script&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --gold-light: #F3E5AB;
            --cream: #FAF6ED;
            --dark: #12100E;
            --card-bg: #1A1814;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--dark); 
            color: var(--cream); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        .font-cinzel { font-family: 'Cinzel', serif; }
        .font-script { font-family: 'Pinyon Script', cursive; }

        /* Container Smartphone Wrapper */
        .phone-wrapper {
            max-width: 440px;
            height: 100vh;
            margin: 0 auto;
            background: var(--dark);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            border-left: 1px solid rgba(212, 175, 55, 0.2);
            border-right: 1px solid rgba(212, 175, 55, 0.2);
        }

        /* Border Elegan */
        .gold-border {
            border: 1px solid rgba(212, 175, 55, 0.4);
            position: relative;
        }
        .gold-border::before {
            content: '';
            position: absolute;
            top: -5px; left: -5px; right: -5px; bottom: -5px;
            border: 1px solid rgba(212, 175, 55, 0.15);
            pointer-events: none;
        }

        /* Slide Step Transition (Bukan Scroll Biasa) */
        .step-section {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            text-align: center;
            background: var(--dark);
            transform: translateY(100%);
            transition: transform 0.8s cubic-bezier(0.77, 0, 0.175, 1), opacity 0.8s ease;
            opacity: 0;
            pointer-events: none;
            z-index: 10;
        }

        .step-section.active {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
            z-index: 20;
        }

        .step-section.exit-prev {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        /* Khusus Cover di Atas Segalanya */
        #step-cover {
            transform: translateY(0);
            opacity: 1;
            pointer-events: auto;
            z-index: 50;
            transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1), opacity 1s ease;
        }
        #step-cover.hidden-cover {
            transform: translateY(-100%);
            opacity: 0;
            pointer-events: none;
        }

        /* Pemutar Musik Melayang */
        .music-box {
            position: fixed;
            bottom: 25px;
            right: calc(50% - 200px);
            z-index: 99;
            cursor: pointer;
            display: none;
        }
        @media (max-width: 450px) { .music-box { right: 20px; } }
        .disk-spin {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, #D4AF37, #8B4513);
            color: #fff;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 5px 15px rgba(212,175,55,0.4);
            animation: spin 10s linear infinite;
        }
        .disk-spin.paused { animation-play-state: paused; }
        @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Custom Scrollbar untuk bagian isi yang panjang */
        .custom-scroll::-webkit-scrollbar { width: 3px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 10px; }
    </style>
</head>
<body>

<div class="phone-wrapper">

    <!-- STEP 0: COVER UTAMA -->
    <section id="step-cover" class="step-section justify-between p-8 bg-[#12100E]">
        <div class="absolute inset-0 z-0">
            <img id="cover-bg" class="w-full h-full object-cover opacity-25 scale-105">
            <div class="absolute inset-0 bg-gradient-to-t from-[#12100E] via-[#12100E]/80 to-transparent"></div>
        </div>
        
        <div class="relative z-10 pt-6">
            <span id="cover-subtitle" class="text-[10px] uppercase tracking-[0.5em] text-[#D4AF37] font-cinzel block"></span>
            <div class="w-10 h-[1px] bg-[#D4AF37] mx-auto mt-2"></div>
        </div>

        <div class="relative z-10 my-auto w-full max-w-xs">
            <p class="text-[10px] uppercase tracking-[0.3em] text-stone-400 mb-2">The Wedding Of</p>
            <h1 id="cover-names" class="font-cinzel text-2xl md:text-3xl font-semibold text-[#F3E5AB] mb-6 leading-snug">...</h1>
            
            <div class="gold-border bg-[#1A1814]/90 p-5 shadow-2xl my-4">
                <p id="cover-group-label" class="text-[9px] uppercase tracking-[0.2em] text-[#D4AF37] mb-1"></p>
                <h2 id="cover-guest" class="font-cinzel text-lg text-white font-medium">Tamu Undangan</h2>
            </div>

            <button onclick="nextStep(1)" class="mt-4 bg-gradient-to-r from-[#D4AF37] to-[#AA7C11] text-[#12100E] text-[10px] uppercase tracking-[0.3em] font-bold py-3 px-8 shadow-xl hover:brightness-110 transition-all">
                <i class="fa-solid fa-envelope-open-text mr-2"></i> Buka Undangan
            </button>
        </div>

        <div class="relative z-10 pb-2">
            <p class="text-[8px] tracking-[0.4em] uppercase text-stone-500 font-cinzel">Omah Aksara Digital</p>
        </div>
    </section>

    <!-- STEP 1: KUTIPAN / FILOSOFI -->
    <section id="step-1" class="step-section bg-[#151310]">
        <div class="max-w-xs mx-auto">
            <i class="fa-solid fa-quote-left text-[#D4AF37] text-2xl mb-4 opacity-80"></i>
            <p id="quote-arab" class="font-cinzel text-base mb-4 text-[#F3E5AB] leading-relaxed"></p>
            <p id="quote-text" class="font-serif italic text-xs text-stone-300 font-light leading-relaxed mb-4"></p>
            <div class="w-8 h-[1px] bg-[#D4AF37] mx-auto mb-3"></div>
            <p id="quote-source" class="text-[9px] uppercase tracking-[0.4em] font-cinzel text-[#D4AF37] mb-8"></p>
            <button onclick="nextStep(2)" class="border border-[#D4AF37] text-[#D4AF37] text-[10px] uppercase tracking-[0.3em] py-2 px-6 hover:bg-[#D4AF37] hover:text-[#12100E] transition-all">Lanjutkan</button>
        </div>
    </section>

    <!-- STEP 2: MEMPELAI PRIA & WANITA -->
    <section id="step-2" class="step-section overflow-y-auto custom-scroll block py-12">
        <div class="max-w-xs mx-auto space-y-12">
            <div class="text-center">
                <span class="text-[9px] uppercase tracking-[0.4em] text-[#D4AF37] font-cinzel block mb-1">Mempelai Pria</span>
                <div class="gold-border p-2 bg-[#12100E] max-w-[200px] mx-auto my-4 shadow-xl">
                    <div class="aspect-[3/4] overflow-hidden"><img id="groom-img" class="w-full h-full object-cover"></div>
                </div>
                <h3 id="groom-name" class="font-cinzel text-xl text-[#F3E5AB] mb-1"></h3>
                <p id="groom-bio" class="text-[11px] text-stone-400 italic"></p>
            </div>

            <div class="text-center">
                <span class="text-[9px] uppercase tracking-[0.4em] text-[#D4AF37] font-cinzel block mb-1">Mempelai Wanita</span>
                <div class="gold-border p-2 bg-[#12100E] max-w-[200px] mx-auto my-4 shadow-xl">
                    <div class="aspect-[3/4] overflow-hidden"><img id="bride-img" class="w-full h-full object-cover"></div>
                </div>
                <h3 id="bride-name" class="font-cinzel text-xl text-[#F3E5AB] mb-1"></h3>
                <p id="bride-bio" class="text-[11px] text-stone-400 italic"></p>
            </div>

            <button onclick="nextStep(3)" class="w-full bg-gradient-to-r from-[#D4AF37] to-[#AA7C11] text-[#12100E] text-[10px] uppercase tracking-[0.3em] font-bold py-3 mt-4">Lihat Acara</button>
        </div>
    </section>

    <!-- STEP 3: WAKTU & ACARA -->
    <section id="step-3" class="step-section overflow-y-auto custom-scroll block py-12">
        <div class="max-w-xs mx-auto">
            <span class="text-[9px] uppercase tracking-[0.5em] text-[#D4AF37] font-cinzel block mb-1">Rangkaian Acara</span>
            <h3 class="font-cinzel text-xl text-[#F3E5AB] mb-8">Waktu & Tempat</h3>
            
            <div id="event-container" class="space-y-6 text-left mb-8"></div>
            
            <div id="countdown-wrap" class="gold-border p-4 bg-[#12100E] hidden mb-6 text-center">
                <p class="text-[9px] uppercase tracking-[0.3em] font-cinzel mb-4 text-[#D4AF37]">Menuju Hari Bahagia</p>
                <div id="countdown" class="flex justify-center gap-2"></div>
            </div>

            <button onclick="nextStep(4)" class="w-full bg-gradient-to-r from-[#D4AF37] to-[#AA7C11] text-[#12100E] text-[10px] uppercase tracking-[0.3em] font-bold py-3">Kisah & Galeri</button>
        </div>
    </section>

    <!-- STEP 4: KISAH & GALERI RUPA -->
    <section id="step-4" class="step-section overflow-y-auto custom-scroll block py-12">
        <div class="max-w-xs mx-auto">
            <span class="text-[9px] uppercase tracking-[0.5em] text-[#D4AF37] font-cinzel block mb-1">Kenangan Indah</span>
            <h3 class="font-cinzel text-xl text-[#F3E5AB] mb-6">Galeri Rupa</h3>
            
            <div id="gallery-grid" class="grid grid-cols-2 gap-2 mb-8"></div>

            <button onclick="nextStep(5)" class="w-full bg-gradient-to-r from-[#D4AF37] to-[#AA7C11] text-[#12100E] text-[10px] uppercase tracking-[0.3em] font-bold py-3">Kirim Hadiah & Doa</button>
        </div>
    </section>

    <!-- STEP 5: TANDA KASIH & UCAPAN -->
    <section id="step-5" class="step-section overflow-y-auto custom-scroll block py-12">
        <div class="max-w-xs mx-auto text-left">
            <div class="text-center mb-6">
                <span class="text-[9px] uppercase tracking-[0.5em] text-[#D4AF37] font-cinzel block mb-1">Tanda Kasih</span>
                <h3 class="font-cinzel text-xl text-[#F3E5AB]">Amplop Digital</h3>
            </div>

            <div id="gift-container" class="space-y-3 mb-8"></div>

            <div class="text-center mb-4">
                <span class="text-[9px] uppercase tracking-[0.5em] text-[#D4AF37] font-cinzel block mb-1">Doa & Restu</span>
                <h3 class="font-cinzel text-xl text-[#F3E5AB]">Buku Tamu</h3>
            </div>

            <form id="wishes-form" class="space-y-3 bg-[#1A1814] p-4 gold-border mb-6">
                <input type="text" id="wish-name" required placeholder="Nama Lengkap" class="w-full bg-[#12100E] border border-stone-800 text-stone-200 px-3 py-2 text-xs focus:border-[#D4AF37] outline-none">
                <div class="grid grid-cols-2 gap-2">
                    <select id="wish-status" class="w-full bg-[#12100E] border border-stone-800 text-stone-200 px-2 py-2 text-xs outline-none">
                        <option value="Hadir">Hadir</option>
                        <option value="Tidak Hadir">Tidak Hadir</option>
                    </select>
                    <select id="wish-pax" class="w-full bg-[#12100E] border border-stone-800 text-stone-200 px-2 py-2 text-xs outline-none">
                        <option value="1">1 Orang</option>
                        <option value="2">2 Orang</option>
                        <option value="3">3 Orang</option>
                        <option value="4">4 Orang</option>
                    </select>
                </div>
                <textarea id="wish-message" required rows="3" placeholder="Tuliskan ucapan dan doa restu..." class="w-full bg-[#12100E] border border-stone-800 text-stone-200 p-3 text-xs resize-none outline-none"></textarea>
                <button type="submit" class="w-full bg-gradient-to-r from-[#D4AF37] to-[#AA7C11] text-[#12100E] font-bold text-[10px] uppercase tracking-[0.3em] py-3">Kirim Doa Restu</button>
            </form>

            <div id="wishes-box" class="space-y-3 max-h-[250px] overflow-y-auto pr-1 mb-6"></div>

            <div class="text-center pb-8">
                <h4 id="footer-names" class="font-cinzel text-lg text-[#F3E5AB] mb-2"></h4>
                <p class="text-[8px] uppercase tracking-[0.4em] text-stone-500 font-cinzel">Omah Aksara Digital Studio</p>
                <button onclick="nextStep(0)" class="mt-6 text-[9px] uppercase tracking-[0.3em] text-[#D4AF37] underline block mx-auto">Kembali ke Awal</button>
            </div>
        </div>
    </section>

</div>

<!-- TOMBOL NAVIGASI STEP BAWAH / KONTROL STEP -->
<div id="music-box" class="music-box">
    <div id="disk-wrap" class="disk-spin paused" onclick="toggleMusic()">
        <i class="fa-solid fa-music text-xs"></i>
    </div>
</div>
<audio id="audio" loop></audio>

<!-- NAVIGASI KONTROL STEP KIRI/KANAN DI LAYAR -->
<div class="fixed bottom-5 left-1/2 -translate-x-1/2 z-45 flex gap-3 pointer-events-none" id="step-nav-buttons">
    <button onclick="prevStep()" class="w-10 h-10 rounded-full bg-[#1A1814]/80 border border-[#D4AF37]/50 text-[#D4AF37] flex items-center justify-center pointer-events-auto shadow-lg hover:bg-[#D4AF37] hover:text-[#12100E] transition-all"><i class="fa-solid fa-arrow-left text-xs"></i></button>
    <button onclick="nextStep()" class="w-10 h-10 rounded-full bg-[#1A1814]/80 border border-[#D4AF37]/50 text-[#D4AF37] flex items-center justify-center pointer-events-auto shadow-lg hover:bg-[#D4AF37] hover:text-[#12100E] transition-all"><i class="fa-solid fa-arrow-right text-xs"></i></button>
</div>

<!-- SCRIPT SISTEM DINAMIS JSON & MULTI-STEP -->
<script>
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'bali-spektakuler';
    const guestName = params.get('to')?.replace(/\+/g,' ') || 'Tamu Undangan';

    const possiblePaths = [
        `../../public/clients/${clientSlug}/`, 
        `../public/clients/${clientSlug}/`, 
        `./public/clients/${clientSlug}/`, 
        `./invitation/public/clients/${clientSlug}/`
    ];
    let basePath = possiblePaths[0];
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzbrMzVWSHCF9u8I1FbY4h4i_GoxL6kvTbFxFrcZ-VG9_qun2wK0c4mIupBKiGk1Yvmw/exec';

    let currentStep = 0;
    const totalSteps = 5;

    function showStep(step) {
        if (step > totalSteps) step = 0;
        if (step < 0) step = totalSteps;
        currentStep = step;

        const cover = document.getElementById('step-cover');
        const navButtons = document.getElementById('step-nav-buttons');

        if (currentStep === 0) {
            cover.classList.remove('hidden-cover');
            navButtons.style.display = 'none';
        } else {
            cover.classList.add('hidden-cover');
            navButtons.style.display = 'flex';
        }

        for (let i = 1; i <= totalSteps; i++) {
            const el = document.getElementById(`step-${i}`);
            if (el) {
                if (i === currentStep) {
                    el.classList.add('active');
                } else {
                    el.classList.remove('active');
                }
            }
        }
    }

    function nextStep(target) {
        if (target !== undefined) {
            showStep(target);
            if(target > 0) playAudioOnOpen();
        } else {
            showStep(currentStep + 1);
            if(currentStep > 0) playAudioOnOpen();
        }
    }

    function prevStep() {
        showStep(currentStep - 1);
    }

    let audioEl = document.getElementById('audio');
    function playAudioOnOpen() {
        if(audioEl.paused) {
            audioEl.play().catch(()=>{});
            document.getElementById('disk-wrap').classList.remove('paused');
        }
    }

    function toggleMusic() {
        if(audioEl.paused){
            audioEl.play();
            document.getElementById('disk-wrap').classList.remove('paused');
        } else {
            audioEl.pause();
            document.getElementById('disk-wrap').classList.add('paused');
        }
    }

    async function initClient() {
        for (let p of possiblePaths) {
            try {
                const r = await fetch(p + 'data.json', { cache: 'no-store' });
                if (r.ok) { basePath = p; break; }
            } catch(e){}
        }

        fetch(basePath + 'data.json', { cache: 'no-store' })
        .then(res => { if(!res.ok) throw new Error('data.json tidak ditemukan'); return res.json(); })
        .then(data => {
            const { couple, settings, events, gallery, quote, music, digitalGift, guest } = data;
            const pairNick = `${couple.groom.nickname} & ${couple.bride.nickname}`;

            document.getElementById('cover-subtitle').innerText = settings?.islami ? 'Pernikahan Suci' : 'Pernikahan Eksklusif';
            document.getElementById('cover-group-label').innerText = guest?.defaultGroup || 'Kepada Yth. Bapak/Ibu/Saudara/i';
            document.getElementById('cover-names').innerText = pairNick;
            document.getElementById('cover-guest').innerText = guestName;
            document.getElementById('footer-names').innerText = pairNick;

            const coverImg = basePath + (gallery.heroImage || gallery.coverImage || '');
            document.getElementById('cover-bg').src = coverImg;

            if(quote && (quote.text || quote.arab)) {
                document.getElementById('quote-arab').textContent = quote.arab || '';
                document.getElementById('quote-text').innerHTML = quote.text ? `“ ${quote.text} ”` : '';
                document.getElementById('quote-source').textContent = quote.source || '';
            }

            document.getElementById('groom-img').src = basePath + couple.groom.image;
            document.getElementById('groom-name').innerText = couple.groom.name;
            document.getElementById('groom-bio').innerText = couple.groom.bio || '';

            document.getElementById('bride-img').src = basePath + couple.bride.image;
            document.getElementById('bride-name').innerText = couple.bride.name;
            document.getElementById('bride-bio').innerText = couple.bride.bio || '';

            if(events?.length) {
                document.getElementById('event-container').innerHTML = events.map(ev => `
                    <div class="gold-border p-4 bg-[#12100E] text-center shadow-lg">
                        <h5 class="font-cinzel text-base text-[#F3E5AB] mb-1">${ev.title}</h5>
                        <p class="text-[9px] uppercase tracking-[0.2em] text-[#D4AF37] mb-2">${new Date(ev.date).toLocaleDateString('id-ID', {weekday:'long', day:'numeric', month:'long', year:'numeric'})}</p>
                        <p class="text-[10px] font-mono text-stone-300 mb-1">${ev.startTime} — ${ev.endTime} ${ev.timezone}</p>
                        <p class="text-[10px] italic text-stone-400 mb-4">${ev.address}</p>
                        <a href="${ev.googleMaps}" target="_blank" class="inline-block border border-[#D4AF37] text-[#D4AF37] px-4 py-2 text-[9px] uppercase tracking-[0.3em] hover:bg-[#D4AF37] hover:text-[#12100E] transition-all">Buka Google Maps</a>
                    </div>
                `).join('');

                if(settings.showCountdown) {
                    const tzMap = { WITA: '+08:00', WIB: '+07:00', WIT: '+09:00' };
                    const tz = tzMap[events[0].timezone] || '+08:00';
                    const targetTime = new Date(`${events[0].date}T${events[0].startTime}:00${tz}`).getTime();
                    setInterval(() => {
                        const diff = targetTime - new Date().getTime();
                        const d = Math.max(0, Math.floor(diff / 86400000)), h = Math.max(0, Math.floor(diff % 86400000 / 3600000)), m = Math.max(0, Math.floor(diff % 3600000 / 60000)), s = Math.max(0, Math.floor(diff % 60000 / 1000));
                        document.getElementById('countdown').innerHTML = `
                            <div class="gold-border p-2 bg-[#1A1814] min-w-[50px]"><span class="font-cinzel text-sm text-[#F3E5AB]">${d}</span><span class="block text-[7px] uppercase text-[#D4AF37]">Hari</span></div>
                            <div class="gold-border p-2 bg-[#1A1814] min-w-[50px]"><span class="font-cinzel text-sm text-[#F3E5AB]">${h}</span><span class="block text-[7px] uppercase text-[#D4AF37]">Jam</span></div>
                            <div class="gold-border p-2 bg-[#1A1814] min-w-[50px]"><span class="font-cinzel text-sm text-[#F3E5AB]">${m}</span><span class="block text-[7px] uppercase text-[#D4AF37]">Menit</span></div>
                            <div class="gold-border p-2 bg-[#1A1814] min-w-[50px]"><span class="font-cinzel text-sm text-[#F3E5AB]">${s}</span><span class="block text-[7px] uppercase text-[#D4AF37]">Detik</span></div>
                        `;
                    }, 1000);
                    document.getElementById('countdown-wrap').classList.remove('hidden');
                }
            }

            if(gallery?.album?.length && settings.showGallery) {
                document.getElementById('gallery-grid').innerHTML = gallery.album.map(img => `
                    <div class="gold-border overflow-hidden aspect-[4/5] bg-[#12100E]">
                        <img src="${basePath + img}" class="w-full h-full object-cover" loading="lazy" onerror="this.parentElement.style.display='none'">
                    </div>
                `).join('');
            }

            if(digitalGift?.accounts?.length && settings.showGift) {
                document.getElementById('gift-container').innerHTML = digitalGift.accounts.map((bank, i) => `
                    <div class="gold-border p-4 bg-[#12100E] text-center">
                        <span class="text-[9px] uppercase tracking-[0.3em] text-[#D4AF37] font-cinzel">${bank.provider}</span>
                        <p class="font-cinzel text-base text-white my-1" id="rek-${i}">${bank.accountNumber}</p>
                        <p class="text-[11px] text-stone-400 mb-3">a.n ${bank.accountHolder}</p>
                        <button onclick="copyRek('rek-${i}')" class="border border-[#D4AF37] text-[#D4AF37] px-3 py-1.5 text-[9px] uppercase tracking-[0.3em] hover:bg-[#D4AF37] hover:text-[#12100E] transition-all">Salin Rekening</button>
                    </div>
                `).join('');
            }

            if(music?.playlist?.length) {
                const defaultSong = music.playlist.find(s => s.isDefault) || music.playlist[0];
                audioEl.src = defaultSong.url.startsWith('http') ? defaultSong.url : basePath + defaultSong.file;
                document.getElementById('music-box').style.display = 'block';
            }

            loadWishes();
        })
        .catch(err => console.error(err));
    }

    initClient();

    document.getElementById('wishes-form').onsubmit = function(e) {
        e.preventDefault();
        const payload = {
            id_klien: clientSlug,
            nama: document.getElementById('wish-name').value,
            ucapan: document.getElementById('wish-message').value,
            kehadiran: document.getElementById('wish-status').value,
            jumlah_tamu: document.getElementById('wish-pax').value
        };
        const btn = this.querySelector('button');
        const originalText = btn.innerText;
        btn.innerText = 'Mengirim...';
        btn.disabled = true;

        fetch(SCRIPT_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(data => {
            if(data.status === 'ok') {
                alert('Terima kasih, doa restu Anda telah terkirim.');
                document.getElementById('wishes-form').reset();
                loadWishes();
            } else {
                alert('Gagal mengirim ucapan.');
            }
        })
        .finally(() => { btn.innerText = originalText; btn.disabled = false; });
    };

    function loadWishes() {
        fetch(SCRIPT_URL + "?id_klien=" + clientSlug)
        .then(res => res.json())
        .then(wishes => {
            const box = document.getElementById('wishes-box');
            if (!Array.isArray(wishes) || wishes.length === 0) {
                box.innerHTML = '<p class="text-[11px] text-center text-stone-500 py-2">Belum ada ucapan.</p>';
                return;
            }
            box.innerHTML = wishes.map(w => `
                <div class="gold-border p-3 bg-[#12100E]">
                    <div class="flex justify-between items-center mb-1">
                        <h6 class="font-cinzel font-semibold text-[11px] text-[#F3E5AB]">${w.nama}</h6>
                        <span class="text-[7px] uppercase tracking-wider px-2 py-0.5 bg-[#1A1814] text-[#D4AF37] border border-[#D4AF37]/30">${w.kehadiran} (${w.pax} Pax)</span>
                    </div>
                    <p class="text-[11px] text-stone-300 leading-relaxed">${w.ucapan}</p>
                </div>
            `).join('');
        }).catch(err => console.error(err));
    }

    function copyRek(id) {
        navigator.clipboard.writeText(document.getElementById(id).innerText).then(() => alert('Nomor rekening berhasil disalin!'));
    }
</script>
</body>
</html>
