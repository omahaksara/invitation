<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Rupa — Immersive Cinematic Deck</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --rose-gold: #E0A996;
            --rose-light: #FCE8E3;
            --dark-rose: #181314;
            --card-bg: rgba(42, 33, 35,  0.75);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            background: var(--dark-rose); 
            color: var(--rose-light); 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            overflow: hidden; 
            height: 100vh;
        }

        .font-cormorant { font-family: 'Cormorant Garamond', serif; }

        /* Container Smartphone Wrapper */
        .phone-wrapper {
            max-width: 440px;
            height: 100vh;
            margin: 0 auto;
            background: radial-gradient(circle at center, #251B1D 0%, #120D0E 100%);
            box-shadow: 0 25px 60px rgba(0,0,0,0.9);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 2rem 1.5rem;
            border-left: 1px solid rgba(224, 169, 150, 0.2);
            border-right: 1px solid rgba(224, 169, 150, 0.2);
        }

        /* Bingkai & Bayangan Mewah (Glow & Blur Effect) */
        .luxury-frame {
            position: relative;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(224, 169, 150, 0.4);
            border-radius: 20px;
            padding: 12px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6), 
                        0 0 30px rgba(224, 169, 150, 0.15),
                        inset 0 0 15px rgba(224, 169, 150, 0.1);
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Efek Tumpukan Kartu Sinematik (Stacked Cards Carousel) */
        .gallery-container {
            position: relative;
            width: 100%;
            height: 62vh;
            display: flex;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
        }

        .gallery-card {
            position: absolute;
            width: 82%;
            height: 100%;
            max-height: 420px;
            border-radius: 20px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.6s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.6s ease, filter 0.6s ease;
            box-shadow: 0 15px 35px rgba(0,0,0,0.7);
            user-select: none;
        }

        .gallery-card img {
            width: 100%;
            height: 100%;
            object-position: center;
            transition: transform 0.8s ease;
        }

        .gallery-card:hover img {
            transform: scale(1.05);
        }

        /* Posisi Dinamis Kartu dalam Tumpukan 3D */
        .gallery-card.active {
            transform: translateX(0) scale(1) rotateY(0deg);
            z-index: 30;
            opacity: 1;
            filter: blur(0px);
        }

        .gallery-card.prev {
            transform: translateX(-55%) scale(0.85) rotateY(15deg);
            z-index: 10;
            opacity: 0.5;
            filter: blur(3px);
            pointer-events: none;
        }

        .gallery-card.next {
            transform: translateX(55%) scale(0.85) rotateY(-15deg);
            z-index: 10;
            opacity: 0.5;
            filter: blur(3px);
            pointer-events: none;
        }

        .gallery-card.hidden-card {
            transform: translateX(0) scale(0.6);
            z-index: 0;
            opacity: 0;
            pointer-events: none;
        }

        /* Lightbox Modal Fullscreen */
        #lightbox {
            position: fixed;
            inset: 0;
            background: rgba(12, 9, 10, 0.95);
            backdrop-filter: blur(20px);
            z-index: 999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }
        #lightbox.show {
            opacity: 1;
            pointer-events: auto;
        }
        #lightbox img {
            max-width: 90%;
            max-height: 80vh;
            border-radius: 12px;
            border: 1px solid rgba(224, 169, 150, 0.5);
            box-shadow: 0 0 50px rgba(224, 169, 150, 0.3);
            transform: scale(0.9);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        #lightbox.show img {
            transform: scale(1);
        }

        /* Custom Scrollbar */
        .custom-dots {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 15px;
        }
        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: rgba(224, 169, 150, 0.3);
            transition: all 0.3s ease;
            cursor: pointer;
        }
        .dot.active {
            width: 24px;
            border-radius: 4px;
            background: var(--rose-gold);
            box-shadow: 0 0 10px rgba(224, 169, 150, 0.6);
        }
    </style>
</head>
<body>

<div class="phone-wrapper">
    <!-- Header Bagian Atas -->
    <div class="text-center pt-2">
        <span class="text-[9px] uppercase tracking-[0.5em] text-[#E0A996] font-cormorant block mb-1">Visual Memories</span>
        <h2 class="font-cormorant text-2xl text-[#FCE8E3] font-semibold italic">Galeri Rupa</h2>
        <div class="w-8 h-[1px] bg-[#E0A996] mx-auto mt-2 opacity-60"></div>
    </div>

    <!-- AREA KARTU GALERI 3D PARALLAX -->
    <div class="gallery-container" id="gallery-deck">
        <!-- Kartu akan dimasukkan secara dinamis lewat JavaScript dari data.json -->
    </div>

    <!-- Navigasi & Indikator Titik -->
    <div class="pb-2">
        <div class="custom-dots" id="dots-container"></div>
        <div class="flex justify-between items-center mt-4 px-6">
            <button onclick="prevCard()" class="w-11 h-11 rounded-full bg-[#2A2123]/80 border border-[#E0A996]/40 text-[#E0A996] flex items-center justify-center shadow-lg hover:bg-[#E0A996] hover:text-[#181314] transition-all">
                <i class="fa-solid fa-arrow-left text-xs"></i>
            </button>
            <p class="text-[10px] uppercase tracking-[0.3em] text-stone-400 font-cormorant" id="counter-text">1 / 5</p>
            <button onclick="nextCard()" class="w-11 h-11 rounded-full bg-[#2A2123]/80 border border-[#E0A996]/40 text-[#E0A996] flex items-center justify-center shadow-lg hover:bg-[#E0A996] hover:text-[#181314] transition-all">
                <i class="fa-solid fa-arrow-right text-xs"></i>
            </button>
        </div>
    </div>
</div>

<!-- LIGHTBOX MODAL (POPUP FULLSCREEN FOTO) -->
<div id="lightbox" onclick="closeLightbox()">
    <button class="absolute top-6 right-6 text-[#E0A996] text-xl w-10 h-10 bg-black/40 rounded-full border border-[#E0A996]/30 flex items-center justify-center">
        <i class="fa-solid fa-xmark"></i>
    </button>
    <img id="lightbox-img" src="" alt="Zoom Foto">
</div>

<!-- SCRIPT PENGATUR DINAMIS JSON & INTERAKSI GESER/SENTUH -->
<script>
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'modern-pink';

    const possiblePaths = [
        `../../public/clients/${clientSlug}/`, 
        `../public/clients/${clientSlug}/`, 
        `./public/clients/${clientSlug}/`, 
        `./invitation/public/clients/${clientSlug}/`
    ];
    let basePath = possiblePaths[0];

    let currentIndex = 0;
    let albumImages = [];

    async function initGallery() {
        for (let p of possiblePaths) {
            try {
                const r = await fetch(p + 'data.json', { cache: 'no-store' });
                if (r.ok) { basePath = p; break; }
            } catch(e){}
        }

        try {
            const res = await fetch(basePath + 'data.json', { cache: 'no-store' });
            const data = await res.json();
            if(data.gallery && data.gallery.album) {
                albumImages = data.gallery.album;
                renderDeck();
            }
        } catch(err) {
            console.error('Gagal memuat galeri:', err);
            // Fallback contoh gambar jika data.json gagal dimuat
            albumImages = ['cover.jpg', 'groom.jpg', 'bride.jpg'];
            renderDeck();
        }
    }

    function renderDeck() {
        const deckContainer = document.getElementById('gallery-deck');
        const dotsContainer = document.getElementById('dots-container');

        deckContainer.innerHTML = albumImages.map((img, i) => `
            <div class="gallery-card luxury-frame ${getCardClass(i)}" onclick="openLightbox('${basePath + img}')">
                <img src="${basePath + img}" loading="lazy" onerror="this.src='https://via.placeholder.com/400x600/181314/E0A996?text=Omah+Aksara'">
            </div>
        `).join('');

        dotsContainer.innerHTML = albumImages.map((_, i) => `
            <div class="dot ${i === currentIndex ? 'active' : ''}" onclick="goToCard(${i})"></div>
        `).join('');

        document.getElementById('counter-text').innerText = `${currentIndex + 1} / ${albumImages.length}`;
    }

    function getCardClass(i) {
        if (i === currentIndex) return 'active';
        if (i === (currentIndex - 1 + albumImages.length) % albumImages.length) return 'prev';
        if (i === (currentIndex + 1) % albumImages.length) return 'next';
        return 'hidden-card';
    }

    function nextCard() {
        currentIndex = (currentIndex + 1) % albumImages.length;
        updateView();
    }

    function prevCard() {
        currentIndex = (currentIndex - 1 + albumImages.length) % albumImages.length;
        updateView();
    }

    function goToCard(index) {
        currentIndex = index;
        updateView();
    }

    function updateView() {
        const cards = document.querySelectorAll('.gallery-card');
        const dots = document.querySelectorAll('.dot');

        cards.forEach((card, i) => {
            card.className = `gallery-card luxury-frame ${getCardClass(i)}`;
        });

        dots.forEach((dot, i) => {
            if (i === currentIndex) dot.classList.add('active');
            else dot.classList.remove('active');
        });

        document.getElementById('counter-text').innerText = `${currentIndex + 1} / ${albumImages.length}`;
    }

    // Touch Swipe Support (Gesture Geser HP Kiri/Kanan)
    let touchStartX = 0;
    let touchEndX = 0;

    const container = document.getElementById('gallery-deck');
    container.addEventListener('touchstart', e => {
        touchStartX = e.changedTouches[0].screenX;
    });

    container.addEventListener('touchend', e => {
        touchEndX = e.changedTouches[0].screenX;
        handleSwipe();
    });

    function handleSwipe() {
        if (touchEndX < touchStartX - 50) nextCard();
        if (touchEndX > touchStartX + 50) prevCard();
    }

    // Lightbox Control
    function openLightbox(src) {
        document.getElementById('lightbox-img').src = src;
        document.getElementById('lightbox').classList.add('show');
    }

    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('show');
    }

    initGallery();
</script>
</body>
</html>
