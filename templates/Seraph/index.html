<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Seraph — Omah Aksara</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    :root {
      --bg-color: #ffffff;
      --text-color: #5c4643;
      --accent: #d4af37; /* emas */
      --soft-color: #f9f6f2;
    }
    body {
      background: var(--bg-color);
      color: var(--text-color);
      font-family: 'Montserrat', sans-serif;
      line-height: 1.8;
    }
    .seraph-title {
      color: var(--accent);
      font-family: 'Playfair Display', serif;
      text-shadow: 0 0 12px rgba(212,175,55,0.4);
      letter-spacing: 0.05em;
    }
    .seraph-card {
      background: var(--soft-color);
      border-radius: 20px;
      border: 1px solid rgba(212,175,55,0.3);
      box-shadow: 0 8px 32px rgba(212,175,55,0.1);
      padding: 20px;
    }
    .reveal-seraph {
      opacity: 0;
      transform: translateY(30px);
      transition: all 1s ease;
    }
    .reveal-seraph.active {
      opacity: 1;
      transform: translateY(0);
    }
  </style>
</head>
<body>

<!-- COVER -->
<section id="cover" class="h-screen flex flex-col justify-center items-center text-center bg-[var(--bg-color)]">
  <h2 id="cover-guest" class="seraph-title text-2xl mb-4"></h2>
  <h1 id="cover-names" class="seraph-title text-5xl mb-6"></h1>
  <p id="cover-date-string" class="text-gray-500 italic mb-8"></p>
  <button id="open-btn" class="seraph-card text-sm uppercase tracking-widest">Buka Undangan</button>
</section>

<!-- HERO -->
<section id="hero" class="min-h-screen flex flex-col justify-center items-center text-center bg-[var(--soft-color)]">
  <h2 id="hero-names" class="seraph-title text-4xl mb-8"></h2>
  <img id="hero-image" class="w-64 h-64 object-cover rounded-xl shadow-lg border-4 border-[var(--accent)]" src="">
</section>

<!-- QUOTE -->
<section id="quote" class="py-24 text-center bg-[var(--bg-color)]">
  <p id="quote-arab" class="seraph-title text-3xl mb-6"></p>
  <p id="quote-text" class="italic text-lg text-gray-700 mb-4"></p>
  <p id="quote-source" class="text-sm text-gray-500"></p>
</section>

<!-- COUPLE -->
<section id="couple" class="py-24 grid grid-cols-1 md:grid-cols-2 gap-12 px-8">
  <div id="groom-section" class="text-center"></div>
  <div id="bride-section" class="text-center"></div>
</section>

<!-- LOVE STORY -->
<section id="story-section" class="py-24 bg-[var(--soft-color)] text-center">
  <h3 class="seraph-title text-3xl mb-12">Love Story</h3>
  <div id="story-list" class="space-y-12"></div>
</section>

<!-- EVENTS -->
<section id="event-section" class="py-24 bg-[var(--bg-color)] text-center">
  <h3 class="seraph-title text-3xl mb-12">Agenda Acara</h3>
  <div id="event-list" class="space-y-8"></div>
  <div id="countdown-wrap" class="mt-12 hidden">
    <h4 class="text-gray-600 mb-6">Countdown</h4>
    <div id="countdown" class="flex justify-center gap-6"></div>
  </div>
</section>

<!-- GALLERY -->
<section id="gallery-section" class="py-24 bg-[var(--soft-color)] text-center">
  <h3 class="seraph-title text-3xl mb-12">Galeri</h3>
  <div id="gallery-grid" class="grid grid-cols-2 md:grid-cols-3 gap-6 px-6"></div>
</section>

<!-- GIFT -->
<section id="gift-section" class="py-24 bg-[var(--bg-color)] text-center">
  <h3 class="seraph-title text-3xl mb-12">Wedding Gift</h3>
  <div id="gift-container" class="space-y-6"></div>
</section>

<!-- RSVP -->
<section id="rsvp-section" class="py-24 bg-[var(--soft-color)] text-center">
  <h3 class="seraph-title text-3xl mb-12">Doa & Restu</h3>
  <form id="wishes-form" class="space-y-6 max-w-md mx-auto">
    <input type="text" id="wish-name" placeholder="Nama Lengkap" class="w-full px-4 py-2 rounded-lg border">
    <select id="wish-status" class="w-full px-4 py-2 rounded-lg border">
      <option value="Hadir">Hadir</option>
      <option value="Tidak Hadir">Tidak Hadir</option>
    </select>
    <textarea id="wish-message" rows="4" placeholder="Ucapan / Doa" class="w-full px-4 py-2 rounded-lg border"></textarea>
    <button type="submit" class="seraph-card w-full">Kirim Ucapan</button>
  </form>
  <div id="wishes-box" class="mt-12 space-y-4"></div>
</section>

<!-- LOGISTICS -->
<section id="logistics-section" class="py-24 bg-[var(--bg-color)] text-center">
  <h3 class="seraph-title text-3xl mb-12">Ketentuan</h3>
  <p id="dresscode-text" class="text-sm text-gray-600 italic mb-6"></p>
  <div id="color-palette" class="flex justify-center gap-3 mb-8"></div>
  <p id="guest-note" class="text-sm text-gray-600 max-w-xs mx-auto leading-relaxed"></p>
</section>

<!-- FOOTER -->
<footer class="py-12 bg-[var(--soft-color)] text-center">
  <h2 id="footer-names" class="seraph-title text-2xl mb-4"></h2>
  <p class="text-gray-600 text-sm">Omah Aksara Digital Studio</p>
</footer>

<audio id="audio" loop></audio>

<script>
  const params = new URLSearchParams(window.location.search);
  const clientSlug = params.get('c') || 'budi-ani';
  const guestName = params.get('to')?.replace(/\+/g,' ') || 'Tamu Undangan';
  const basePath = `../../public/clients/${clientSlug}/`;

  fetch(`${basePath}data.json`, { cache: 'no-store' })
    .then(res => res.json())
    .then(data => {
      const { couple, events, gallery, loveStory, quote, logistics } = data;
      const pairNick = `${couple.groom.nickname} & ${couple.bride.nickname}`;

      document.getElementById('cover-names').innerText = pairNick;
      document.getElementById('hero-names').innerText = pairNick;
      document.getElementById('footer-names').innerText = pairNick;
      document.getElementById('cover-guest').innerText = guestName;
      document.getElementById('hero-image').src = basePath + gallery.heroImage;

      if(events?.length){
        document.getElementById('event-section').classList.remove('hidden');
        document.getElementById('event-list').innerHTML = events.map(ev => `
          <div class="seraph-card reveal-seraph">
            <h5 class="seraph-title text-xl mb-2">${ev.title}</h5>
            <p class="text-gray-700 text-sm">${new Date(ev.date).toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</p>
            <p class="text-gray-500 text-xs">${ev.startTime} — ${ev.endTime}</p>
            <p class="text-gray-500 text-xs italic">${ev.address}</p
