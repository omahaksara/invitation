<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Wedding of Alfia & Fikri - Omah Aksara</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <!-- React & ReactDOM CDN -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <!-- Babel CDN for JSX -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --taupe: #b9a99a;
      --taupe-dark: #a69687;
      --beige: #f6f1eb;
      --beige-deep: #ede6de;
      --brown: #4a3728;
      --cream: #fffcf8;
      --cream-card: #fffbf6;
      --line: #e6ddd3;
      --surface: #fffcf8;
      --muted: #8c7b6e;
    }

    * {
      font-family: 'Poppins', sans-serif;
    }

    h1, h2, h3, h4 {
      font-family: 'Playfair Display', serif;
    }

    .script {
      font-family: 'Great Vibes', 'Dancing Script', cursive;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      background: var(--surface);
      color: var(--brown);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .reveal {
      opacity: 0;
      transform: translateY(18px);
      transition: opacity 0.9s cubic-bezier(0.2, 0.8, 0.2, 1), transform 0.9s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .reveal.in {
      opacity: 1;
      transform: translateY(0);
    }

    .ornament-line {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
    }

    .ornament-dot {
      width: 28px;
      height: 28px;
      border: 1px solid var(--taupe);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .custom-scrollbar::-webkit-scrollbar {
      width: 4px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: var(--line);
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // --- DATA MEMPELAI & DOKUMENTASI ---
    const WEDDING_DATA = {
      bride: {
        name: "Alfia",
        full: "Alfia Putri",
        child: "Putri Pertama",
        parents: "Bapak H. Ahmad & Ibu Hj. Siti Aminah",
        initial: "A"
      },
      groom: {
        name: "Fikri",
        full: "Muhammad Fikri",
        child: "Putra Kedua",
        parents: "Bapak H. Usman & Ibu Hj. Fatimah",
        initial: "F"
      },
      date: new Date("2026-05-06T08:00:00+07:00"),
      akad: {
        dateLabel: "Rabu, 06 Mei 2026",
        time: "08:00 WIB - Selesai",
        place: "Masjid Al-Ikhlas",
        address: "Jl. Melati No. 12, Kebayoran Baru, Jakarta Selatan",
        maps: "https://maps.google.com/?q=Masjid+Al+Ikhlas+Jakarta"
      },
      resepsi: {
        dateLabel: "Rabu, 06 Mei 2026",
        time: "11:00 WIB - Selesai",
        place: "The Manor Andara",
        address: "Jl. Andara Raya No. 88, Cilandak, Jakarta Selatan",
        maps: "https://maps.google.com/?q=The+Manor+Andara"
      },
      gift: {
        bank: "BCA",
        number: "1234 5678 9012",
        name: "Alfia Putri",
        address: "Jl. Kemang Timur No. 23, Jakarta Selatan 12730"
      }
    };

    const STORIES = [
      { year: "2012", title: "Pertama Bertemu", desc: "Berawal dari bangku SMP, kami dipertemukan sebagai teman sekelas yang duduk bersebelahan. Tak ada yang menyangka pertemuan sederhana itu menjadi awal cerita panjang.", color: "#F6F1EB" },
      { year: "2014", title: "Sahabat Sejati", desc: "Lulus SMP, kami melanjutkan ke SMA yang berbeda. Namun persahabatan kami tetap terjaga lewat surat dan pertemuan di perpustakaan kota setiap akhir pekan.", color: "#EDE6DE" },
      { year: "2022", title: "Jatuh Cinta Kembali", desc: "Setelah 8 tahun berpisah kota untuk kuliah, takdir mempertemukan kami kembali di Jakarta. Obrolan yang sempat tertunda, akhirnya berlanjut menjadi rasa.", color: "#F6F1EB" },
      { year: "Mei 2023", title: "Lamaran", desc: "Di bawah langit senja Pantai Sanur, Fikri melamar dengan cincin yang ia simpan sejak 6 bulan. Tanpa ragu, Alfia menjawab 'Ya' dengan air mata bahagia.", color: "#EDE6DE" }
    ];

    const GALLERY = Array.from({ length: 9 }).map((_, i) => ({
      id: i,
      label: `Moment ${i + 1}`,
      color: i % 3 === 0 ? "#EDE6DE" : i % 3 === 1 ? "#F6F1EB" : "#FFFBF6"
    }));

    // --- HELPER HOOKS ---
    function useGuestName() {
      const [name, setName] = useState("Nama Tamu");
      useEffect(() => {
        const params = new URLSearchParams(window.location.search);
        const guest = params.get("to") || params.get("nama") || params.get("name") || params.get("guest");
        if (guest) setName(decodeURIComponent(guest));
      }, []);
      return name;
    }

    function useCountdown(targetDate) {
      const [timeLeft, setTimeLeft] = useState(() => targetDate.getTime() - Date.now());
      useEffect(() => {
        const interval = setInterval(() => setTimeLeft(targetDate.getTime() - Date.now()), 1000);
        return () => clearInterval(interval);
      }, [targetDate]);

      const r = Math.max(0, timeLeft);
      return {
        days: Math.floor(r / (1000 * 60 * 60 * 24)),
        hours: Math.floor((r / (1000 * 60 * 60)) % 24),
        mins: Math.floor((r / (1000 * 60)) % 60),
        secs: Math.floor((r / 1000) % 60)
      };
    }

    function useScrollReveal() {
      const refs = useRef(new Map());
      useEffect(() => {
        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                entry.target.classList.add("in");
              }
            });
          },
          { threshold: 0.15 }
        );

        refs.current.forEach((el) => observer.observe(el));
        return () => observer.disconnect();
      }, []);

      return (key) => (el) => {
        if (el) refs.current.set(key, el);
        else refs.current.delete(key);
      };
    }

    // --- KOMPONEN UTAMA ---
    function App() {
      const guestName = useGuestName();
      const countdown = useCountdown(WEDDING_DATA.date);
      const setRevealRef = useScrollReveal();

      const [isCoverOpen, setIsCoverOpen] = useState(true);
      const [isClosingCover, setIsClosingCover] = useState(false);
      const [isPlayingAudio, setIsPlayingAudio] = useState(false);
      const [activeModalImage, setActiveModalImage] = useState(null);
      const [copiedText, setCopiedText] = useState(null);

      const [wishes, setWishes] = useState([
        { id: "1", name: "Sahabat SMP", message: "Akhirnyaa! Dari jaman seragam putih biru sampai pelaminan. Bahagia selalu Alfia & Fikri!", attend: "Hadir", time: "2 jam lalu" },
        { id: "2", name: "Keluarga Andara", message: "Barakallah, semoga menjadi keluarga sakinah mawaddah warahmah. Dilancarkan sampai hari H!", attend: "Hadir", time: "5 jam lalu" },
        { id: "3", name: "Rekan Kerja", message: "Selamat menempuh hidup baru! Turut berbahagia untuk kalian berdua.", attend: "Ragu", time: "kemarin" }
      ]);

      const [formData, setFormData] = useState({ name: "", message: "", attend: "Hadir" });

      const audioCtxRef = useRef(null);
      const gainNodeRef = useRef(null);
      const oscillatorsRef = useRef([]);

      // Inisialisasi Audio Synthesizer sederhana
      const startAudio = async () => {
        setIsPlayingAudio(true);
        try {
          if (!audioCtxRef.current) {
            const AudioContext = window.AudioContext || window.webkitAudioContext;
            const ctx = new AudioContext();
            audioCtxRef.current = ctx;

            const gain = ctx.createGain();
            gain.gain.value = 0;
            gain.connect(ctx.destination);
            gainNodeRef.current = gain;

            const osc1 = ctx.createOscillator();
            osc1.type = "sine";
            osc1.frequency.value = 220;

            const osc2 = ctx.createOscillator();
            osc2.type = "triangle";
            osc2.frequency.value = 329.63;

            osc1.connect(gain);
            osc2.connect(gain);
            osc1.start();
            osc2.start();

            oscillatorsRef.current = [osc1, osc2];
          }

          if (audioCtxRef.current.state === "suspended") {
            await audioCtxRef.current.resume();
          }

          if (gainNodeRef.current && audioCtxRef.current) {
            gainNodeRef.current.gain.linearRampToValueAtTime(0.06, audioCtxRef.current.currentTime + 1.2);
          }
        } catch (e) {
          console.error("Audio Web API Error", e);
        }
      };

      const stopAudio = () => {
        setIsPlayingAudio(false);
        try {
          if (gainNodeRef.current && audioCtxRef.current) {
            gainNodeRef.current.gain.linearRampToValueAtTime(0, audioCtxRef.current.currentTime + 0.6);
          }
        } catch (e) {}
      };

      const handleOpenInvitation = () => {
        setIsClosingCover(true);
        startAudio();
        setTimeout(() => {
          setIsCoverOpen(false);
          document.getElementById("countdown")?.scrollIntoView({ behavior: "smooth" });
        }, 800);
      };

      const copyToClipboard = (text, label) => {
        const textarea = document.createElement("textarea");
        textarea.value = text;
        textarea.style.position = "fixed";
        textarea.style.opacity = "0";
        document.body.appendChild(textarea);
        textarea.select();
        try {
          document.execCommand("copy");
          setCopiedText(label);
          setTimeout(() => setCopiedText(null), 2000);
        } catch (e) {}
        document.body.removeChild(textarea);
      };

      const handleFormSubmit = (e) => {
        e.preventDefault();
        if (!formData.name.trim() || !formData.message.trim()) return;

        const newWish = {
          id: Date.now().toString(),
          name: formData.name.trim(),
          message: formData.message.trim(),
          attend: formData.attend,
          time: "baru saja"
        };

        setWishes((prev) => [newWish, ...prev]);
        setFormData({ name: "", message: "", attend: "Hadir" });
      };

      const scrollToSection = (id) => {
        document.getElementById(id)?.scrollIntoView({ behavior: "smooth", block: "start" });
      };

      const formattedDate = useMemo(() => {
        return WEDDING_DATA.date.toLocaleDateString("id-ID", {
          weekday: "long",
          day: "numeric",
          month: "long",
          year: "numeric"
        });
      }, []);

      return (
        <div className="min-h-screen w-full overflow-x-clip relative">
          {/* TOAST SALIN TEKS */}
          {copiedText && (
            <div className="fixed left-1/2 -translate-x-1/2 top-20 z-50 bg-[var(--brown)] text-white text-[12px] px-4 py-2 rounded-full shadow-lg transition-all">
              {copiedText} tersalin
            </div>
          )}

          {/* AUDIO BUTTON */}
          <div className="fixed right-4 top-4 z-40 flex flex-col gap-3">
            <button
              onClick={() => (isPlayingAudio ? stopAudio() : startAudio())}
              className="w-11 h-11 rounded-full bg-white border border-[var(--line)] shadow-[0_8px_24px_rgba(0,0,0,0.08)] flex items-center justify-center hover:scale-105 transition-transform"
              aria-label="Toggle Audio"
            >
              {isPlayingAudio ? (
                <i data-lucide="music" className="w-4 h-4 text-[var(--brown)]"></i>
              ) : (
                <i data-lucide="volume-x" className="w-4 h-4 text-[var(--muted)]"></i>
              )}
            </button>
          </div>

          {/* COVER PEMBUKA */}
          {isCoverOpen && (
            <div
              className={`fixed inset-0 z-[100] flex flex-col items-center justify-between px-6 py-10 transition-all duration-700 ${
                isClosingCover ? "opacity-0 pointer-events-none -translate-y-[20px]" : "opacity-100"
              }`}
              style={{ background: "var(--cream)", border: "12px solid var(--beige)" }}
            >
              <div className="w-full flex justify-center pt-6">
                <div className="flex flex-col items-center gap-3">
                  <div className="ornament-dot">
                    <i data-lucide="sparkles" className="w-3.5 h-3.5 text-[var(--taupe)]"></i>
                  </div>
                  <p className="text-[11px] tracking-[0.35em] uppercase text-[var(--taupe)]">The Wedding of</p>
                </div>
              </div>

              <div className="flex-1 flex flex-col items-center justify-center w-full max-w-[380px] text-center">
                <div className="w-full border border-[var(--line)] rounded-[32px] bg-white/70 backdrop-blur p-10 py-14 shadow-[0_20px_60px_rgba(74,55,40,0.06)]">
                  <h1 className="script text-[56px] leading-[0.9] text-[var(--brown)]">
                    <span className="block">{WEDDING_DATA.bride.name}</span>
                    <span className="block text-[40px] my-2 text-[var(--taupe)]" style={{ fontFamily: "Great Vibes" }}>&</span>
                    <span className="block">{WEDDING_DATA.groom.name}</span>
                  </h1>

                  <div className="mt-8 ornament-line"></div>

                  <p className="mt-6 text-[13px] leading-relaxed text-[var(--muted)]">
                    Dengan memohon rahmat dan ridho Allah SWT, kami mengundang Bapak/Ibu/Saudara/i untuk hadir di hari bahagia kami
                  </p>

                  <div className="mt-10 bg-[var(--beige)] rounded-2xl py-5 px-4 border border-[var(--line)]">
                    <p className="text-[11px] tracking-[0.2em] uppercase text-[var(--taupe)]">Kepada Yth.</p>
                    <p className="mt-2 font-medium text-[16px] text-[var(--brown)]" style={{ fontFamily: "Playfair Display" }}>
                      {guestName}
                    </p>
                    <p className="text-[11px] mt-1 text-[var(--muted)]">di Tempat</p>
                  </div>
                </div>
              </div>

              <div className="w-full flex flex-col items-center gap-4 pb-2">
                <button
                  onClick={handleOpenInvitation}
                  className="group relative bg-[var(--brown)] text-white rounded-full px-8 py-3.5 text-[13px] tracking-[0.2em] uppercase flex items-center gap-3 hover:bg-[#3a2b1e] transition-all shadow-[0_10px_30px_rgba(74,55,40,0.25)]"
                >
                  <span>Buka Undangan</span>
                  <span className="w-7 h-7 rounded-full bg-white/15 flex items-center justify-center group-hover:translate-x-0.5 transition-transform">
                    <i data-lucide="chevron-right" className="w-4 h-4"></i>
                  </span>
                </button>
                <p className="text-[10px] tracking-[0.2em] uppercase opacity-60 text-[var(--muted)]">
                  Mohon maaf jika ada kesalahan penulisan nama/gelar
                </p>
              </div>

              <div
                className="pointer-events-none absolute inset-0 opacity-[0.03]"
                style={{ backgroundImage: "radial-gradient(var(--brown) 1px, transparent 1px)", backgroundSize: "22px 22px" }}
              ></div>
            </div>
          )}

          {/* HALAMAN UTAMA UNDANGAN */}
          <main className="w-full max-w-[980px] mx-auto">
            {/* HERO SECTION */}
            <section id="home" className="px-6 md:px-10 pt-16 pb-10 text-center">
              <p className="text-[11px] tracking-[0.4em] uppercase text-[var(--taupe)]">We Are Getting Married</p>
              <h2 ref={setRevealRef("hero")} className="reveal script text-[64px] md:text-[84px] leading-[0.9] mt-6 text-[var(--brown)]">
                {WEDDING_DATA.bride.name} & {WEDDING_DATA.groom.name}
              </h2>
              <p className="mt-4 text-[14px] text-[var(--muted)]">{formattedDate} • Jakarta Selatan</p>
              <div className="mt-8 flex justify-center">
                <div className="w-[1px] h-16 bg-[var(--line)]"></div>
              </div>
            </section>

            {/* COUNTDOWN SECTION */}
            <section id="countdown" className="px-6 md:px-10">
              <div ref={setRevealRef("countdown")} className="reveal bg-white border border-[var(--line)] rounded-[24px] p-6 md:p-8 shadow-[0_12px_40px_rgba(74,55,40,0.05)]">
                <div className="flex items-center justify-between mb-6">
                  <h3 className="text-[14px] tracking-[0.25em] uppercase text-[var(--taupe)]">Menuju Hari Bahagia</h3>
                  <i data-lucide="heart" className="w-4 h-4 text-[var(--taupe)]"></i>
                </div>
                <div className="grid grid-cols-4 gap-3">
                  {[
                    { v: countdown.days, l: "Hari" },
                    { v: countdown.hours, l: "Jam" },
                    { v: countdown.mins, l: "Menit" },
                    { v: countdown.secs, l: "Detik" }
                  ].map((item, idx) => (
                    <div key={idx} className="bg-[var(--beige)] border border-[var(--line)] rounded-[16px] py-5 text-center">
                      <div className="text-[28px] md:text-[32px] font-semibold leading-none text-[var(--brown)]" style={{ fontFamily: "Playfair Display" }}>
                        {String(item.v).padStart(2, "0")}
                      </div>
                      <div className="mt-2 text-[11px] tracking-[0.18em] uppercase text-[var(--muted)]">{item.l}</div>
                    </div>
                  ))}
                </div>
                <div className="mt-6 text-center">
                  <button
                    onClick={() => scrollToSection("event")}
                    className="text-[12px] tracking-[0.2em] uppercase border-b border-[var(--brown)] pb-1 hover:opacity-70 transition-opacity text-[var(--brown)]"
                  >
                    Simpan Tanggal
                  </button>
                </div>
              </div>
            </section>

            {/* KUTIPAN AL-QURAN */}
            <section className="px-6 md:px-10 mt-12">
              <div ref={setRevealRef("ayat")} className="reveal bg-[var(--cream-card)] border border-[var(--line)] rounded-[28px] p-8 md:p-12 text-center relative overflow-hidden">
                <div className="absolute top-0 left-1/2 -translate-x-1/2 w-[120px] h-[1px] bg-[var(--taupe)]"></div>
                <p className="text-[22px] md:text-[26px] leading-[1.6] mt-2 text-[var(--brown)]" style={{ fontFamily: "Playfair Display" }}>
                  وَمِنْ آيَاتِهِ أَنْ خَلَقَ لَكُمْ مِنْ أَنْفُسِكُمْ أَزْوَاجًا
                </p>
                <p className="mt-6 text-[13px] leading-[1.9] max-w-[560px] mx-auto text-[var(--muted)]">
                  “Dan di antara tanda-tanda (kebesaran)-Nya ialah Dia menciptakan pasangan-pasangan untukmu dari jenismu sendiri, agar kamu cenderung dan merasa tenteram kepadanya, dan Dia menjadikan di antaramu rasa kasih dan sayang.”
                </p>
                <div className="mt-6 inline-flex items-center gap-3 px-5 py-2 rounded-full bg-white border border-[var(--line)]">
                  <span className="text-[11px] tracking-[0.2em] uppercase text-[var(--taupe)]">QS. Ar-Rum: 21</span>
                </div>
              </div>
            </section>

            {/* SALAM MEMPELAI */}
            <section className="px-6 md:px-10 mt-16 text-center">
              <div ref={setRevealRef("salam")} className="reveal max-w-[640px] mx-auto">
                <p className="script text-[36px] text-[var(--brown)]">Assalamu’alaikum Wr. Wb.</p>
                <div className="mt-6 ornament-line max-w-[120px] mx-auto"></div>
                <p className="mt-6 text-[13.5px] leading-[1.9] text-center text-[var(--muted)]">
                  Dengan memohon rahmat dan ridho Allah Subhanahu Wa Ta’ala, insyaAllah kami akan menyelenggarakan acara pernikahan putra-putri kami. Merupakan suatu kehormatan dan kebahagiaan bagi kami apabila Bapak/Ibu/Saudara/i berkenan hadir untuk memberikan doa restu kepada kedua mempelai.
                </p>
              </div>
            </section>

            {/* SECTION PROFIL MEMPELAI */}
            <section id="mempelai" className="px-6 md:px-10 mt-20">
              <div className="text-center mb-10">
                <p className="text-[11px] tracking-[0.35em] uppercase text-[var(--taupe)]">The Beloved</p>
                <h2 className="mt-3 text-[32px] text-[var(--brown)]" style={{ fontFamily: "Playfair Display" }}>Bride & Groom</h2>
              </div>

              <div ref={setRevealRef("couple")} className="reveal grid md:grid-cols-[1fr_auto_1fr] gap-6 md:gap-0 items-center">
                {/* MEMPELAI WANITA */}
                <div className="bg-white border border-[var(--line)] rounded-[28px] p-8 text-center">
                  <div className="mx-auto w-[132px] h-[132px] rounded-full bg-[var(--beige)] border border-[var(--line)] flex items-center justify-center relative">
                    <span className="script text-[56px] text-[var(--brown)]">{WEDDING_DATA.bride.initial}</span>
                    <div className="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[var(--taupe)] text-white flex items-center justify-center text-[10px] tracking-widest">
                      Bride
                    </div>
                  </div>
                  <h3 className="mt-6 script text-[38px] leading-none text-[var(--brown)]">{WEDDING_DATA.bride.full}</h3>
                  <p className="mt-3 text-[12px] tracking-[0.15em] uppercase text-[var(--taupe)]">{WEDDING_DATA.bride.child}</p>
                  <div className="mt-4 ornament-line"></div>
                  <p className="mt-4 text-[12.5px] leading-[1.6] text-[var(--muted)]">{WEDDING_DATA.bride.parents}</p>
                </div>

                <div className="flex justify-center md:px-6">
                  <div className="w-16 h-16 rounded-full bg-[var(--brown)] text-white flex items-center justify-center shadow-[0_12px_30px_rgba(74,55,40,0.2)]">
                    <span className="script text-[32px] -mt-1">&</span>
                  </div>
                </div>

                {/* MEMPELAI PRIA */}
                <div className="bg-white border border-[var(--line)] rounded-[28px] p-8 text-center">
                  <div className="mx-auto w-[132px] h-[132px] rounded-full bg-[var(--beige)] border border-[var(--line)] flex items-center justify-center relative">
                    <span className="script text-[56px] text-[var(--brown)]">{WEDDING_DATA.groom.initial}</span>
                    <div className="absolute -bottom-1 -right-1 w-8 h-8 rounded-full bg-[var(--brown)] text-white flex items-center justify-center text-[10px] tracking-widest">
                      Groom
                    </div>
                  </div>
                  <h3 className="mt-6 script text-[38px] leading-none text-[var(--brown)]">{WEDDING_DATA.groom.full}</h3>
