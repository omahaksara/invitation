<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Karsa — Omah Aksara</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        /*... style kamu yang sama persis... */
        :root { --theme-color: #5A6955; --bg-color: #F7F5F0; --text-color: #242923; --soft-color: #E2D9CB; --white-soft: #FDFDFB; }
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body { background: var(--bg-color); color: var(--text-color); font-family: 'Montserrat', sans-serif; overflow-x: hidden; line-height: 1.8; }
      .font-serif { font-family: 'Cormorant Garamond', serif; }.font-arab { font-family: 'Scheherazade New', serif; }
      .reveal { opacity: 0; transform: translateY(40px); transition: all 1.6s cubic-bezier(0.16, 1, 0.3, 1); }.reveal.active { opacity: 1; transform: translateY(0); }
        #cover { transition: transform 1.8s cubic-bezier(0.76, 0, 0.24, 1), opacity 1.8s; }
      .cover-gradient { background: linear-gradient(to top, rgba(15,18,15,0.9) 0%, rgba(15,18,15,0.4) 50%, rgba(0,0,0,0) 100%); }
      .btn-open { border: 1px solid rgba(255,255,255,0.25); background: rgba(255,255,255,0.05); backdrop-filter: blur(15px); padding: 18px 44px; letter-spacing: 5px; font-size: 9px; text-transform: uppercase; transition: all 0.6s; }
      .phone-wrapper { max-width: 425px; margin: 0 auto; background: var(--white-soft); box-shadow: 0 40px 100px rgba(0,0,0,0.04); position: relative; min-height: 100vh; }
      .editorial-frame { position: relative; width: 80%; aspect-ratio: 3/4; margin: 0 auto; overflow: hidden; box-shadow: 0 30px 70px rgba(0,0,0,0.07); background: #f0ebe1; }
      .editorial-frame img { width: 100%; height: 100%; object-fit: cover; }.arch-mask { border-radius: 200px 200px 0 0; }
      .timeline-card { position: relative; padding-left: 28px; border-left: 1px solid var(--soft-color); }
      .timeline-card::before { content: ''; position: absolute; left: -3px; top: 6px; width: 5px; height: 5px; border-radius: 50%; background: var(--theme-color); }
      .btn-editorial { display: inline-block; border: 1px solid var(--theme-color); color: var(--theme-color); padding: 14px 38px; font-size: 10px; letter-spacing: 4px; text-transform: uppercase; }
      .music-disk-box { position: fixed; bottom: 35px; right: calc(50% - 190px); z-index: 90; cursor: pointer; } @media (max-width: 435px) {.music-disk-box { right: 25px; } }
      .disk-text-wrap { width: 52px; height: 52px; background: rgba(255, 255, 255, 0.9); border: 1px solid var(--soft-color); border-radius: 50%; display: flex; align-items: center; justify-content: center; animation: rotateDisk 8s linear infinite; }
      .disk-text-wrap.paused { animation-play-state: paused; } @keyframes rotateDisk { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    </style>
</head>
<body>
<section id="cover" class="fixed inset-0 z-[100] flex items-center justify-center overflow-hidden bg-[#111411]">
    <img id="cover-image" class="absolute inset-0 w-full h-full object-cover opacity-50 scale-105" src="" crossorigin="anonymous">
    <div class="cover-gradient absolute inset-0"></div>
    <div class="relative z-10 text-center text-white px-8 max-w-sm">
        <p class="font-serif italic text-lg mb-3 opacity-70">The Wedding</p>
        <h1 id="cover-names" class="font-serif text-5xl font-light mb-12 leading-tight"></h1>
        <div class="h-px w-12 bg-white/20 mx-auto mb-10"></div>
        <p class="uppercase tracking-[0.4em] text-xs mb-2.5 text-stone-400">Salam Hangat Untuk:</p>
        <h2 id="cover-guest" class="font-serif text-2xl font-light text-stone-200 mb-14"></h2>
        <button id="open-btn" class="btn-open">Dengan Bahagia Mengundang</button>
    </div>
</section>
<main id="app" class="phone-wrapper opacity-0 pb-1">
    <section class="relative h-[90vh] flex items-end justify-center px-6 pb-20 overflow-hidden">
        <img id="hero-image" class="absolute inset-0 w-full h-full object-cover" src="">
        <div class="absolute inset-0 bg-gradient-to-t from-white via-white/20 to-black/10"></div>
        <div class="relative z-10 text-center w-full">
            <p class="font-serif italic text-xl text-stone-600 mb-2">Undangan Pernikahan</p>
            <div class="h-px w-10 bg-stone-300 mx-auto mb-6"></div>
            <h2 id="hero-names" class="font-serif text-5xl font-light tracking-wide text-[var(--text-color)]"></h2>
        </div>
    </section>
    <section class="px-10 py-28 text-center reveal">
        <p id="quote-arab" class="font-arab text-3xl mb-10 text-[var(--theme-color)] leading-loose"></p>
        <p id="quote-text" class="font-serif italic text-lg text-stone-700 font-light leading-relaxed"></p>
        <p id="quote-source" class="text-xs uppercase tracking-[0.35em] text-stone-400 mt-8"></p>
    </section>
    <section class="py-16 bg-[#F3EFE6]/40">
        <div id="groom-section" class="px-8 mb-20"></div>
        <div class="py-6 text-center"><span class="font-serif text-4xl italic text-stone-300">&</span></div>
        <div id="bride-section" class="px-8"></div>
    </section>
    <section id="story-section" class="py-28 bg-white hidden"><div id="story-list" class="px-10 space-y-12"></div></section>
    <section id="event-section" class="py-28 px-8 border-t hidden"><div id="event-list" class="space-y-4"></div><div id="countdown-wrap" class="mt-20 hidden"><div id="countdown" class="flex justify-center gap-6"></div></div></section>
    <section id="gallery-section" class="py-28 px-6 bg-[#FBFBFA] hidden"><div id="gallery-grid" class="grid grid-cols-2 gap-3"></div></section>
    <section id="gift-section" class="py-28 px-8 bg-stone-50 hidden"><div id="gift-container" class="space-y-3"></div></section>
    <section id="rsvp-section" class="py-28 px-6 bg-[var(--bg-color)]">
        <form id="wishes-form" class="space-y-4 bg-white/60 p-6 border border-[var(--soft-color)] mb-10">
            <input type="text" id="wish-name" required placeholder="Nama" class="w-full bg-transparent border-b py-2 text-sm">
            <div class="grid grid-cols-2 gap-4">
                <select id="wish-status" class="w-full bg-transparent border-b py-2 text-sm"><option value="Hadir">Hadir</option><option value="Tidak Hadir">Tidak Hadir</option></select>
                <select id="wish-pax" class="w-full bg-transparent border-b py-2 text-sm"><option value="1">1 Pax</option><option value="2">2 Pax</option><option value="3">3 Pax</option><option value="4">4 Pax</option></select>
            </div>
            <textarea id="wish-message" required rows="3" placeholder="Pesan / Doa" class="w-full bg-transparent border p-3 text-sm"></textarea>
            <button type="submit" class="w-full bg-[var(--theme-color)] text-white text-xs uppercase tracking-[0.4em] py-4">Kirim Ucapan</button>
        </form>
        <div id="wishes-box" class="space-y-4 max-h-96 overflow-y-auto"></div>
    </section>
    <footer class="py-28 bg-[#111411] text-white text-center px-8"><h2 id="footer-names" class="font-serif text-4xl font-light tracking-widest text-stone-200 mb-12"></h2></footer>
</main>
<div id="music-btn" class="music-disk-box hidden"><div id="disk-wrap" class="disk-text-wrap"><i id="music-icon-state" class="fa-solid fa-play absolute text-sm"></i></div></div>
<audio id="audio" loop></audio>
<script>
    const params = new URLSearchParams(window.location.search);
    const clientSlug = params.get('c') || 'afif-sindi';
    const guestName = params.get('to')?.replace(/\+/g,' ') || 'Tamu Undangan';
    const basePath = `/public/clients/${clientSlug}/`; // <-- KUNCI BIAR ALL PASANGAN BISA. Kalau error ganti jadi../../public/clients/${clientSlug}/
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwzbrMzVWSHCF9u8I1FbY4h4i_GoxL6kvTbFxFrcZ-VG9_qun2wK0c4mIupBKiGk1Yvmw/exec';
    fetch(`${basePath}data.json?v=${Date.now()}`, { cache: 'no-store' }).then(r=>{if(!r.ok)throw new Error('data.json tidak ditemukan di '+basePath);return r.json()}).then(data=>{
        const { couple, settings, events, gallery, loveStory, quote, music, digitalGift } = data;
        const pairNick = `${couple.groom.nickname} & ${couple.bride.nickname}`;
        if(settings?.themeColor) document.documentElement.style.setProperty('--theme-color', settings.themeColor);
        document.getElementById('cover-names').innerText = pairNick; document.getElementById('hero-names').innerText = pairNick; document.getElementById('footer-names').innerText = pairNick; document.getElementById('cover-guest').innerText = guestName;
        document.getElementById('hero-image').src = basePath + gallery.heroImage; document.getElementById('cover-image').src = basePath + gallery.heroImage;
        if(quote?.text){document.getElementById('quote-arab').textContent=quote.arab||'';document.getElementById('quote-text').innerHTML=`“ ${quote.text} ”`;document.getElementById('quote-source').textContent=quote.source||'';}
        document.getElementById('groom-section').innerHTML = `<div class="editorial-frame arch-mask"><img src="${basePath+couple.groom.image}"></div><h4 class="font-serif text-4xl mt-8">${couple.groom.name}</h4>`;
        document.getElementById('bride-section').innerHTML = `<div class="editorial-frame arch-mask"><img src="${basePath+couple.bride.image}"></div><h4 class="font-serif text-4xl mt-8 text-right">${couple.bride.name}</h4>`;
        if(events?.length){document.getElementById('event-section').classList.remove('hidden');document.getElementById('event-list').innerHTML='';events.forEach(ev=>{document.getElementById('event-list').innerHTML+=`<div class="bg-white p-8 text-center mb-6"><h5 class="font-serif text-2xl">${ev.title}</h5><p>${ev.date}</p><p>${ev.startTime} - ${ev.endTime}</p><a href="${ev.googleMaps}" target="_blank" class="btn-editorial mt-4 inline-block">Buka Peta</a></div>`;});}
        if(loveStory?.length){document.getElementById('story-section').classList.remove('hidden');document.getElementById('story-list').innerHTML='';loveStory.forEach(ls=>{document.getElementById('story-list').innerHTML+=`<div class="timeline-card"><p>${ls.date||ls.year}</p><h6>${ls.title}</h6><p>${ls.description}</p></div>`;});}
        if(gallery?.album?.length){document.getElementById('gallery-section').classList.remove('hidden');document.getElementById('gallery-grid').innerHTML='';gallery.album.forEach(img=>{document.getElementById('gallery-grid').innerHTML+=`<img src="${basePath+img}" loading="lazy">`;});}
        if(digitalGift?.accounts?.length){document.getElementById('gift-section').classList.remove('hidden');document.getElementById('gift-container').innerHTML='';digitalGift.accounts.forEach((bank,i)=>{document.getElementById('gift-container').innerHTML+=`<div class="p-4 bg-white border text-center"><p id="rek-${i}">${bank.accountNumber}</p><p>a.n ${bank.accountHolder}</p><button onclick="copyRek('rek-${i}')">Salin</button></div>`;});}
        if(music?.playlist?.length){const s=music.playlist.find(x=>x.isDefault)||music.playlist[0];document.getElementById('audio').src=s.url;document.getElementById('music-btn').classList.remove('hidden');document.getElementById('music-btn').onclick=()=>{const a=document.getElementById('audio');a.paused?a.play():a.pause();};}
        function loadWishes(){const box=document.getElementById('wishes-box');const cb='cb_'+Date.now();window[cb]=function(w){box.innerHTML='';(w||[]).forEach(x=>{box.innerHTML+=`<div class="p-4 bg-white border"><b>${x.nama}</b> - ${x.kehadiran}<br>${x.ucapan}</div>`});delete window[cb];};const sc=document.createElement('script');sc.src=`${SCRIPT_URL}?id_klien=${clientSlug}&callback=${cb}&t=${Date.now()}`;document.body.appendChild(sc);} loadWishes();
        document.getElementById('wishes-form').addEventListener('submit',function(e){e.preventDefault();fetch(SCRIPT_URL,{method:'POST',mode:'no-cors',body:JSON.stringify({id_klien:clientSlug,nama:document.getElementById('wish-name').value,ucapan:document.getElementById('wish-message').value,kehadiran:document.getElementById('wish-status').value,jumlah_tamu:parseInt(document.getElementById('wish-pax').value)})}).then(()=>{this.reset();setTimeout(loadWishes,1500)});});
        document.getElementById('open-btn').onclick=()=>{document.getElementById('cover').style.transform='translateY(-100%)';document.getElementById('app').style.opacity='1';document.getElementById('audio').play().catch(()=>{});document.querySelectorAll('.reveal').forEach(el=>el.classList.add('active'));}
    }).catch(err=>{document.body.innerHTML=`<div style="padding:40px;text-align:center"><h1>Error</h1><p>${err.message}</p><p>Slug: ${clientSlug}</p></div>`;});
    function copyRek(id){navigator.clipboard.writeText(document.getElementById(id).innerText).then(()=>alert('Disalin'));}
</script>
</body>
</html>
