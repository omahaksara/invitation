        .nocturne{
          overflow-x: clip;
          background: linear-gradient(180deg, #f7f4ef 0%, #ede6dc 100%);
          padding-bottom: 100px;
          color: var(--text-main);
          font-family: 'Plus Jakarta Sans', sans-serif;
          line-height: 1.7;
        }
        .nocturne *{box-sizing:border-box}
        .nocturne .serif{font-family: 'Playfair Display', serif;}
        .nocturne .gold{color: var(--accent)}
        .nocturne .eyebrow{
          font-size: .72rem;
          letter-spacing: .32em;
          text-transform: uppercase;
          color: var(--accent);
          font-weight: 500;
          font-family: 'Cinzel', serif;
        }
        .nocturne .eyebrow-light{
          font-size: .72rem;
          letter-spacing: .32em;
          text-transform: uppercase;
          color: rgba(255,255,255,0.7);
          font-weight: 400;
          font-family: 'Cinzel', serif;
        }
        .nocturne .ornament{
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 14px;
          color: var(--accent);
          margin: 22px auto;
          opacity: 0.85;
        }
        .nocturne .ornament:before,
        .nocturne .ornament:after{
          content: "";
          width: 50px;
          height: 1px;
          background: linear-gradient(90deg, transparent, var(--accent));
        }
        .nocturne .ornament:after{transform: rotate(180deg)}
        .nocturne .ornament-light{color: rgba(255,255,255,0.5)}
        .nocturne .ornament-light:before,
        .nocturne .ornament-light:after{
          background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4));
        }
        .nocturne .panel{
          position: relative;
          border: 1px solid var(--line);
          background: var(--bg-card);
          border-radius: 20px;
          padding: clamp(28px, 5vw, 56px);
          margin: clamp(18px, 4vw, 34px) auto;
          max-width: 1120px;
          box-shadow: 0 10px 40px rgba(0,0,0,0.03);
          transition: transform 0.6s cubic-bezier(0.16,1,0.3,1), box-shadow 0.6s cubic-bezier(0.16,1,0.3,1);
        }
        .nocturne .panel:hover{
          transform: translateY(-3px);
          box-shadow: 0 18px 60px rgba(184, 93, 56, 0.09);
        }
        .nocturne .panel:before{
          content: "✦";
          position: absolute;
          top: -11px;
          left: 50%;
          transform: translateX(-50%);
          padding: 0 14px;
          background: var(--bg-card);
          color: var(--accent);
          font-size: 14px;
          letter-spacing: 0.2em;
        }
        .nocturne .panel.no-dot:before{display:none}

        /* COVER */
        .nocturne .cover{
          min-height: 100svh;
          position: fixed;
          inset: 0;
          display: grid;
          place-items: center;
          text-align: center;
          padding: 36px 22px;
          background: #2b2b2b;
          isolation: isolate;
          z-index: 50;
          transition: transform 1.2s cubic-bezier(0.77, 0, 0.175, 1);
          will-change: transform;
        }
        .nocturne .cover.open{
          transform: translateY(-101%);
        }
        .nocturne .cover>img{
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
          z-index: -2;
          opacity: .46;
          animation: nocturneZoom 20s ease-in-out infinite alternate;
          transform-origin: center center;
        }
        .nocturne .cover:after{
          content: "";
          position: absolute;
          inset: 0;
          z-index: -1;
          background: linear-gradient(180deg, rgba(43,43,43,0.18) 0%, rgba(43,43,43,0.42) 45%, #2b2b2b 92%);
        }
        .nocturne .arch{
          width: min(100%, 680px);
          padding: clamp(36px, 7vw, 82px) 22px 44px;
          border: 1px solid rgba(255,255,255,0.22);
          border-radius: 28px;
          background: rgba(43, 43, 43, 0.46);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          box-shadow: 0 24px 70px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.08);
          color: #fff;
          animation: fadeUp 1.2s cubic-bezier(0.16,1,0.3,1) both;
        }
        .nocturne .cover-title{
          font-family: 'Playfair Display', serif;
          font-weight: 400;
          font-style: italic;
          font-size: clamp(42px, 9vw, 84px);
          line-height: 0.95;
          letter-spacing: -0.02em;
          margin: 12px 0 6px;
        }
        .nocturne .cover-title em{
          font-style: italic;
          font-weight: 600;
          color: #fff;
        }
        .nocturne .cover-amp{
          font-family: 'Playfair Display', serif;
          font-style: italic;
          font-weight: 400;
          font-size: clamp(28px, 5vw, 42px);
          opacity: 0.9;
          margin: 0 10px;
          color: var(--accent-light);
        }
        .nocturne .btn-open{
          margin-top: 28px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 10px;
          padding: 14px 32px;
          border-radius: 999px;
          border: 1px solid rgba(184, 93, 56, 0.8);
          background: transparent;
          color: #fff;
          font-family: 'Cinzel', serif;
          font-size: 0.74rem;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          cursor: pointer;
          transition: all 0.5s cubic-bezier(0.16,1,0.3,1);
          position: relative;
          overflow: hidden;
        }
        .nocturne .btn-open:before{
          content:"";
          position:absolute;
          inset:0;
          background: var(--accent);
          transform: scaleX(0);
          transform-origin: left;
          transition: transform 0.55s cubic-bezier(0.77,0,0.175,1);
          z-index:-1;
        }
        .nocturne .btn-open:hover{
          border-color: var(--accent);
          color: #fff;
          transform: translateY(-1px);
        }
        .nocturne .btn-open:hover:before{
          transform: scaleX(1);
        }
        .nocturne .btn-open:active{transform: scale(0.97)}

        /* Reveal */
        .reveal{
          opacity: 0;
          transform: translateY(30px);
          transition: opacity 1s cubic-bezier(0.16,1,0.3,1), transform 1s cubic-bezier(0.16,1,0.3,1);
          will-change: opacity, transform;
        }
        .reveal.active{
          opacity: 1;
          transform: translateY(0);
        }
        .reveal-delay-1{transition-delay: 0.12s}
        .reveal-delay-2{transition-delay: 0.24s}
        .reveal-delay-3{transition-delay: 0.36s}

        /* Countdown */
        .count-grid{
          display: grid;
          grid-template-columns: repeat(4, 1fr);
          gap: 14px;
          margin-top: 28px;
        }
        .count-box{
          border: 1px solid var(--line);
          border-radius: 16px;
          padding: 18px 10px;
          text-align: center;
          background: linear-gradient(180deg, var(--bg-card) 0%, var(--accent-light) 160%);
          position: relative;
          overflow: hidden;
        }
        .count-box:before{
          content:"";
          position:absolute;
          top:0; left:0; right:0;
          height: 2px;
          background: linear-gradient(90deg, transparent, var(--accent), transparent);
          opacity: 0.6;
        }
        .count-num{
          font-family: 'Playfair Display', serif;
          font-size: clamp(28px, 4vw, 42px);
          font-weight: 600;
          color: var(--accent);
          line-height: 1;
        }
        .count-label{
          font-family: 'Cinzel', serif;
          font-size: 0.62rem;
          letter-spacing: 0.22em;
          text-transform: uppercase;
          color: var(--text-muted);
          margin-top: 8px;
        }

        /* Couple */
        .couple-grid{
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 32px;
          margin-top: 18px;
        }
        .couple-card{
          text-align: center;
        }
        .couple-photo{
          width: 100%;
          aspect-ratio: 4/5;
          border-radius: 18px;
          background: linear-gradient(180deg, #ede6dc, #f7f4ef);
          border: 1px solid var(--line);
          position: relative;
          overflow: hidden;
          display: grid;
          place-items: center;
        }
        .couple-photo-inner{
          width: 76%;
          aspect-ratio: 1;
          border-radius: 50%;
          border: 1px solid var(--line);
          background: radial-gradient(circle at 30% 30%, #fff 0%, #f3e6e1 40%, #ede6dc 100%);
          display: grid;
          place-items: center;
          font-family: 'Playfair Display', serif;
          font-style: italic;
          font-size: 48px;
          color: var(--accent);
          box-shadow: 0 10px 30px rgba(184,93,56,0.12);
        }
        .couple-name{
          font-family: 'Playfair Display', serif;
          font-style: italic;
          font-weight: 600;
          font-size: clamp(24px, 3vw, 32px);
          margin-top: 18px;
          color: var(--text-main);
        }

        /* Events */
        .event-grid{
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 20px;
        }
        .event-card{
          border: 1px solid var(--line);
          border-radius: 16px;
          padding: 28px;
          background: linear-gradient(180deg, var(--bg-card), rgba(243,230,225,0.5));
          position: relative;
        }
        .event-card h4{
          font-family: 'Cinzel', serif;
          letter-spacing: 0.22em;
          font-size: 0.72rem;
          color: var(--accent);
          margin-bottom: 10px;
        }

        /* Story */
        .timeline{
          position: relative;
          padding-left: 36px;
          margin-top: 8px;
        }
        .timeline:before{
          content:"";
          position:absolute;
          left: 9px;
          top: 8px;
          bottom: 8px;
          width: 1px;
          background: linear-gradient(180deg, var(--accent), transparent 90%);
          animation: lineGrow 1.8s cubic-bezier(0.16,1,0.3,1) both;
        }
        .tl-item{
          position: relative;
          padding-bottom: 36px;
        }
        .tl-dot{
          position:absolute;
          left: -31px;
          top: 6px;
          width: 10px;
          height: 10px;
          border-radius: 50%;
          background: var(--bg-card);
          border: 1.5px solid var(--accent);
          box-shadow: 0 0 0 4px var(--accent-light);
        }
        .tl-year{
          font-family: 'Cinzel', serif;
          font-size: 0.7rem;
          letter-spacing: 0.24em;
          color: var(--accent);
        }

        /* Gallery */
        .gallery{
          display: grid;
          grid-template-columns: repeat(12, 1fr);
          gap: 12px;
          margin-top: 20px;
        }
        .g-item{
          border-radius: 14px;
          overflow: hidden;
          border: 1px solid var(--line);
          background: var(--accent-light);
          position: relative;
        }
        .g-1{grid-column: span 8; aspect-ratio: 16/10;}
        .g-2{grid-column: span 4; aspect-ratio: 1/1;}
        .g-3{grid-column: span 4; aspect-ratio: 4/5;}
        .g-4{grid-column: span 8; aspect-ratio: 16/11;}
        .g-5{grid-column: span 5; aspect-ratio: 4/3;}
        .g-6{grid-column: span 7; aspect-ratio: 16/10;}
        .g-inner{
          width: 100%; height: 100%;
          display: grid; place-items: center;
          font-family: 'Playfair Display', serif;
          font-style: italic;
          color: var(--accent);
          background: radial-gradient(120% 120% at 30% 20%, #fff 0%, #f3e6e1 50%, #ede6dc 100%);
        }

        /* Gift */
        .gift-box{
          border: 1px dashed rgba(184,93,56,0.35);
          border-radius: 14px;
          padding: 22px;
          display: flex;
          justify-content: space-between;
          align-items: center;
          gap: 16px;
          background: rgba(243,230,225,0.4);
        }

        /* Wishes */
        .wish-input{
          width: 100%;
          border: 1px solid var(--line);
          border-radius: 12px;
          padding: 12px 16px;
          background: var(--bg-card);
          font-family: 'Plus Jakarta Sans', sans-serif;
          outline: none;
          transition: border-color 0.3s, box-shadow 0.3s;
          color: var(--text-main);
        }
        .wish-input:focus{
          border-color: var(--accent);
          box-shadow: 0 0 0 4px var(--accent-light);
        }

        @keyframes nocturneZoom{
          0%{transform: scale(1) translate(0,0)}
          100%{transform: scale(1.15) translate(-12px, -10px)}
        }
        @keyframes fadeUp{
          from{opacity:0; transform: translateY(40px) scale(0.98)}
          to{opacity:1; transform: translateY(0) scale(1)}
        }
        @keyframes fadeIn{
          from{opacity:0}
          to{opacity:1}
        }
        @keyframes lineGrow{
          from{transform: scaleY(0); transform-origin: top}
          to{transform: scaleY(1); transform-origin: top}
        }

        @media (max-width: 780px){
          .couple-grid{grid-template-columns: 1fr; gap: 40px}
          .event-grid{grid-template-columns: 1fr}
          .count-grid{gap: 10px}
          .gallery{grid-template-columns: repeat(6,1fr)}
          .g-1{grid-column: span 6}
          .g-2{grid-column: span 3}
          .g-3{grid-column: span 3}
          .g-4{grid-column: span 6}
          .g-5{grid-column: span 6}
          .g-6{grid-column: span 6}
        }
