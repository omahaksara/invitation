<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Karsa — Omah Aksara</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/color-thief/2.3.2/color-thief.umd.js"></script>

    <style>
        :root {
            --theme-color: #5A6955;
            --bg-color: #F7F5F0;
            --text-color: #242923;
            --soft-color: #E2D9CB;
            --white-soft: #FDFDFB;
            --accent: #C49263;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html { scroll-behavior: smooth; }
        body {
            background: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            line-height: 1.8;
            -webkit-font-smoothing: antialiased;
        }

       .font-serif { font-family: 'Cormorant Garamond', serif; }
       .font-arab { font-family: 'Scheherazade New', serif; }

        /* SCROLL REVEAL ELEGANT EDITORIAL */
       .reveal { opacity: 0; transform: translateY(40px); transition: all 1.6s cubic-bezier(0.16, 1, 0.3, 1); }
       .reveal.active { opacity: 1; transform: translateY(0); }

       .line-draw { width: 0%; transition: width 2s cubic-bezier(0.16, 1, 0.3, 1); }
       .reveal.active .line-draw { width: 100%; }

        /* COVER SCREEN LUXE */
        #cover { transition: transform 1.8s cubic-bezier(0.76, 0, 0.24, 1), opacity 1.8s; }
       .cover-gradient { background: linear-gradient(to top, rgba(15,18,15,0.9) 0%, rgba(15,18,15,0.4) 50%, rgba(0,0,0,0) 100%); }

       .btn-open {
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 18px 44px;
            letter-spacing: 5px;
            font-size: 9px;
            text-transform: uppercase;
            transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }
       .btn-open:hover { background: #ffffff; color: #111411; border-color: #ffffff; letter-spacing: 7px; }

        /* CONTAINER SIMULASI FRAMELESS SMARTPHONE */
       .phone-wrapper {
            max-width: 425px;
            margin: 0 auto;
            background: var(--white-soft);
            box-shadow: 0 40px 100px rgba(0,0,0,0.04);
            position: relative;
            min-height: 100vh;
        }

        /* FINE ART PHOTO STRUCTURE */
       .editorial-frame {
            position: relative;
            width: 80%;
            aspect-ratio: 3/4;
            margin: 0 auto;
            overflow: hidden;
            box-shadow: 0 30px 70px rgba(0,0,0,0.07);
            border: 1px solid rgba(0,0,0,0.03);
            background: #f0ebe1;
        }
       .editorial-frame img { width: 100%; height: 100%; object-fit: cover; transition: transform 3s ease; }
       .editorial-frame:hover img { transform: scale(1.06); }

        /* ASYMMETRIC OVERLAYS */
       .arch-mask { border-radius: 200px 200px 0 0; }

        /* TIMELINE DESIGN / SASMITA */
       .timeline-card {
            position: relative;
            padding-left: 28px;
            border-left: 1px solid var(--soft-color);
        }
       .timeline-card::before {
            content: '';
            position: absolute;
            left: -3px;
            top: 6px;
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background: var(--theme-color);
        }

        /* BUTTON LUXE */
       .btn-editorial {
            display: inline-block;
            border: 1px solid var(--theme-color);
            color: var(--theme-color);
            padding: 14px 38px;
            font-size: 10px;
            letter-spacing: 4px;
            text-transform: uppercase;
            transition: all 0.5s cubic-bezier(0.16, 1, 0.3, 1);
            background: transparent;
        }
       .btn-editorial:hover { background: var(--theme-color); color: #fff; letter-spacing: 5px; }
