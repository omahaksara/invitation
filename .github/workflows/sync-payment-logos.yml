name: Sync local payment logos

on:
  workflow_dispatch:
  push:
    branches:
      - fix/theme-dock-identities-audit
      - main
    paths:
      - "scripts/sync-payment-logos.cjs"
      - "scripts/sync-wikimedia-bank-catalog.cjs"
      - ".github/workflows/sync-payment-logos.yml"

permissions:
  contents: write

concurrency:
  group: sync-payment-logos-${{ github.ref }}
  cancel-in-progress: false

jobs:
  download-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current feature branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Download and validate local logo assets
        run: |
          node scripts/sync-payment-logos.cjs
          node scripts/sync-wikimedia-bank-catalog.cjs

      - name: Commit downloaded assets to this feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/payment clients/demo-katalog/bank/logo-bca.svg clients/demo-katalog/bank/logo-bri.svg clients/demo-katalog/bank/logo-mandiri.svg
          if git diff --cached --quiet; then
            echo "No logo asset changes."
          else
            git commit -m "Add verified local bank and wallet logos"
            git pull --rebase origin "${{ github.ref_name }}"
            git push origin "HEAD:${{ github.ref_name }}"
          fi
