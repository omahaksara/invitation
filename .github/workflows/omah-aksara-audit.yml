name: Omah Aksara template and API audit

on:
  push:
    branches:
      - main
      - rebuild/v2-clean-public
      - release/all-themes-sync
      - rebuild/public-ready-v2
  pull_request:
    branches:
      - main
      - rebuild/omah-aksara-v2
  workflow_dispatch:

concurrency:
  group: template-audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax
        run: |
          node --check core/app.js
          cp backend/Code.gs /tmp/omah-aksara-backend.js
          node --check /tmp/omah-aksara-backend.js
      - name: Validate V2 data and local assets
        run: node scripts/validate-invitations.cjs
      - name: Verify all themes and demo data
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const assert = require('node:assert/strict');
          const app = fs.readFileSync('core/app.js', 'utf8');
          const registry = JSON.parse(fs.readFileSync('templates/registry.json', 'utf8'));
          const themeNames = registry.themes.filter(theme => theme.status === 'active').map(theme => theme.slug);
          const themes = themeNames.map(name => 'templates/' + name + '/index.html');

          assert.match(app, /const isThemeSlug = value =>/,
            'demo theme selection must support newly added template slugs automatically');
          assert.match(app, /data\.demoMode\s*===\s*true/, 'theme override must be limited to demo invitations');
          assert.match(app, /requestedAlias/, 'legacy theme alias handling missing');
          assert.match(app, /function setupCover\(\)/, 'cover initialization missing');
          assert.ok(app.includes("footer.parentNode.insertBefore(section, footer)"), 'legacy forms must handle nested footers safely');
          assert.match(app, /else\s*\{[\s\S]*musicToggle\.style\.display = "flex"/,
            'themes without an opening-cover button must still show music controls');
          assert.match(app, /function setupMusic\(/, 'music setup missing');
          assert.match(app, /function applyFeatureFlags\(/, 'central feature flags missing');
          assert.match(app, /function ensureFeatureSections\(/, 'shared fallback sections missing');
          assert.match(app, /function downloadCalendarEvent\(/, 'calendar export missing');
          assert.doesNotMatch(app, /AKfycbysPpEGRqUtTluNSS8V1aUEwRU2zkO75aMiy0yEqAhlbbTf9yx-Cq1qjCZlKai-Ch6s7g/, 'production API URL must not be hard-coded');
          assert.ok(app.includes('parsedTemplate.head.querySelectorAll("style")'), 'full-document theme CSS must be mounted');
          assert.doesNotMatch(app.slice(app.indexOf('function setupMusic('), app.indexOf('function setupCountdown(')),
            /button\.textContent\s*=\s*["']♫["']/, 'music toggle must not destroy nested theme icons');

          for (const file of themes) {
            assert.ok(fs.existsSync(file), file + ' is missing');
            const html = fs.readFileSync(file, 'utf8');
            const styleCount = (html.match(/<style\b/gi) || []).length;
            assert.equal(styleCount, 1, file + ' must contain exactly one embedded style block');
            assert.match(html, /<\/style\s*>/i, file + ' style block must be closed');
            for (const binding of ['couple.groom.nickname', 'couple.bride.nickname',
              'couple.groom.fullName', 'couple.bride.fullName']) {
              assert.ok(html.includes('data-bind="' + binding + '"'), file + ' missing ' + binding);
            }
            assert.match(html, /id=["']bg-music["']/, file + ' missing background audio element');
            assert.match(html, /id=["']music-(?:toggle|btn)["']/, file + ' missing music control');
          }

          const demo = JSON.parse(fs.readFileSync('clients/demo-katalog/data.json', 'utf8'));
          assert.equal(demo.demoMode, true, 'catalog demo must explicitly enable safe theme switching');
          assert.equal(demo.status, 'published', 'catalog demo must be publishable');
          assert.equal(demo.schemaVersion, 2, 'catalog demo must use V2 data schema');
          assert.equal(demo.features.calendar, true, 'catalog demo must exercise calendar');
          assert.equal(demo.features.rsvp, true, 'catalog demo must exercise RSVP');
          assert.equal(demo.features.guestbook, true, 'catalog demo must exercise guestbook');
          assert.ok(Array.isArray(demo.gifts.accounts) && demo.gifts.accounts.length > 0, 'catalog demo must show a clearly marked dummy gift account');
          for (const theme of themeNames) {
            assert.ok(fs.existsSync(path.join('templates', theme, 'index.html')), 'theme folder missing: ' + theme);
          }
          console.log('All configured theme structures, couple bindings, music controls and demo data passed.');
          NODE

      - name: Unit-test RSVP and guestbook backend
        run: node scripts/test-backend.cjs

      - name: Install Playwright browser
        run: |
          npm install --no-save playwright
          npx playwright install chromium
      - name: Smoke test all themes in Chromium
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/omah-aksara-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then break; fi
            sleep 1
          done
          node scripts/smoke-templates.cjs

  live-api-readiness:
    # Read-only GET health probe is safe to run on PRs as well as main pushes.
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify live Apps Script health (read-only)
        run: node scripts/check-live-api.cjs
