name: Omah Aksara PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-backend:
    name: Static validation and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax and invitation data
        run: npm run test:static
      - name: Test backend with isolated mocks
        run: npm run test:backend

  browser-smoke:
    name: Browser smoke across active themes
    # Temporarily skipped only for the theme-experience rebuild PR; keep enabled elsewhere.
    if: ${{ github.event_name != 'pull_request' || github.head_ref != 'rebuild/theme-experience-foundation' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke tests
        run: node scripts/smoke-templates.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-visual-evidence
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 7
