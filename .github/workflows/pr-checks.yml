name: Omah Aksara PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - rebuild/theme-experience-foundation

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-backend:
    name: Static validation and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject changes to client invitation JSON
        shell: bash
        run: |
          git fetch origin main
          forbidden="$(git diff --name-only origin/main...HEAD | grep -E '^clients/.*/data[.]json$' | grep -Ev '^clients/demo-katalog/data[.]json$' || true)"
          if [ -n "$forbidden" ]; then
            echo "::error::Client invitation JSON is protected and must not be changed:"
            echo "$forbidden"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax and invitation data
        run: npm run test:static
      - name: Test backend with isolated mocks
        run: npm run test:backend

  browser-smoke:
    name: Browser smoke across active themes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke tests
        run: node scripts/smoke-templates.cjs
      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-visual-evidence
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 7
