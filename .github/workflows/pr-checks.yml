name: Omah Aksara PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - rebuild/theme-experience-foundation

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-backend:
    name: Static validation and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reject changes to all client invitation JSON
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          changed="$(git diff --name-only origin/main HEAD)"
          forbidden_data="$(printf '%s\n' "$changed" | grep -E '^clients/.*/data[.]json$' || true)"
          forbidden_live="$(printf '%s\n' "$changed" | grep -E '^clients/venni-rama/' || true)"
          forbidden_theme="$(printf '%s\n' "$changed" | grep -E '^templates/aksav/index[.]html$' || true)"
          if [ -n "$forbidden_data" ] || [ -n "$forbidden_live" ] || [ -n "$forbidden_theme" ]; then
            echo "::error::Client data, Venni-Rama assets, and the protected Aksav theme must remain identical to main:"
            printf '%s\n' "$forbidden_data" "$forbidden_live" "$forbidden_theme"
            exit 1
          fi
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run static and theme contract checks
        run: npm run test:static
      - name: Run isolated backend unit tests
        run: npm run test:backend

  browser-smoke:
    name: Browser smoke across active themes
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run isolated browser smoke tests
        run: node scripts/smoke-templates.cjs
      - name: Upload screenshots and motion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-browser-visual-evidence
          path: artifacts/visual/
          if-no-files-found: ignore
          retention-days: 7
