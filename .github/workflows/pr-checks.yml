name: Omah Aksara PR checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-and-backend:
    name: Static validation and backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check JavaScript syntax and invitation data
        run: npm run test:static
      - name: Test backend with isolated mocks
        run: npm run test:backend

  browser-visual:
    name: Browser visual and interaction smoke (all active themes)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save --no-package-lock playwright
          npx playwright install --with-deps chromium
      - name: Run desktop and mobile theme smoke tests
        run: npm run test:browser
      - name: Upload per-theme screenshots and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: omah-aksara-theme-visual-evidence
          path: artifacts/visual/
          if-no-files-found: warn
          retention-days: 14
