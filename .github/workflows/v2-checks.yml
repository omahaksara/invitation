name: Omah Aksara V2 checks

on:
  push:
    branches:
      - main
      - rebuild/public-ready-v2
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Validate invitation data and local assets
        run: npm run validate:data
      - name: Run static template smoke tests
        run: npm run test:smoke
